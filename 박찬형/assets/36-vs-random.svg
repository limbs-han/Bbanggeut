<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 412" width="900" height="412" role="img" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,sans-serif">
<title>같은 길이 구간을 무작위로 뽑을 때 대비 다중신호 선택의 위치</title><desc>영상마다 같은 길이의 모든 구간을 나열했을 때 최악에서 최고까지의 범위 안에서 무작위 평균과 다중신호 선택이 어디에 놓이는지 보여준다. 다중신호 선택은 다섯 영상 모두 최고 구간 점수의 95.7퍼센트 이상에 있고, 평균 98.0퍼센트다.</desc>
<style>.bg{fill:#ffffff} .t{fill:#1a1a19} .ts{fill:#52514e} .tm{fill:#6f6e69}</style>
<rect x="0" y="0" width="900" height="412" fill="#ffffff"/><circle cx="7" cy="15" r="6" fill="#8a8880"/><text x="20" y="19" font-size="13" class="ts">무작위로 뽑았을 때 평균</text><circle cx="207" cy="15" r="8" fill="#2a78d6"/><text x="221" y="19" font-size="13" class="ts">다중신호 선택</text><rect x="340" y="10" width="12" height="10" rx="2" fill="#1baf7a"/><text x="358" y="19" font-size="13" class="ts">뽑을 수 있는 최고</text><text x="500" y="19" font-size="13" class="tm">막대 = 그 영상에서 같은 길이로 뽑을 수 있는 전체 범위</text><text x="150" y="52" font-size="15" font-weight="500" class="t">구간의 사건 점수</text><text x="150" y="70" font-size="12" class="tm">높을수록 좋다</text><text x="496" y="52" font-size="15" font-weight="500" class="t">쓸데없는 구간이 차지한 비율</text><text x="496" y="70" font-size="12" class="tm">낮을수록 좋다</text><text x="0" y="52" font-size="15" font-weight="500" class="t">영상</text><text x="0" y="70" font-size="12" class="tm">뽑은 길이</text><text x="0" y="108" font-size="14" font-weight="500" class="t">1번 · 웃음·대화</text><text x="0" y="125" font-size="12" font-family="Consolas,SFMono-Regular,monospace" class="tm">40초 · 후보 81개</text><rect x="150" y="104" width="300" height="8" rx="4" fill="#c3c2b7" fill-opacity="0.45"/><rect x="306.2" y="104" width="143.8" height="8" rx="4" fill="#2a78d6" fill-opacity="0.18"/><rect x="447" y="100" width="6" height="16" rx="2" fill="#1baf7a"/><circle cx="306.2" cy="108" r="6" fill="#8a8880"/><circle cx="450.0" cy="108" r="8" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/><text x="150" y="132" font-size="11" font-family="Consolas,SFMono-Regular,monospace" class="tm">0.295</text><text x="450" y="132" text-anchor="end" font-size="11" font-family="Consolas,SFMono-Regular,monospace" fill="#1baf7a">0.351</text><text x="450.0" y="95" text-anchor="middle" font-size="12" font-weight="500" font-family="Consolas,SFMono-Regular,monospace" fill="#2a78d6">0.351</text><text x="458" y="113" font-size="12" font-weight="500" fill="#2a78d6">100%</text><rect x="496" y="104" width="300" height="8"