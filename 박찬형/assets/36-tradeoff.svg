<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 466" width="900" height="466" role="img" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,sans-serif">
<title>고정창 길이별 놓친 하이라이트와 담긴 잉여</title><desc>웃음 트리거 고정창은 짧으면 하이라이트의 61퍼센트를 놓치고, 120초로 늘리면 놓침은 0이지만 결과물의 46퍼센트가 평상시 구간이다. 다중신호 선택은 44.6초에 놓침 34.3퍼센트 잉여 35.0퍼센트로, 더 긴 50초 고정창보다 두 값이 모두 낮다.</desc>
<style>.t{fill:#1a1a19} .ts{fill:#52514e} .tm{fill:#898781}
@media (prefers-color-scheme:dark){.t{fill:#f5f5f0} .ts{fill:#c3c2b7} .tm{fill:#9a9892}}</style>
<text x="236" y="26" font-size="15" font-weight="500" fill="#eb6834">중요한 부분이 날아간 비율</text><text x="236" y="46" font-size="12" class="tm">하이라이트 67개 중 결과물 밖으로 나간 것</text><text x="544" y="26" font-size="15" font-weight="500" fill="#8a8880">쓸데없는 구간이 차지한 비율</text><text x="544" y="46" font-size="12" class="tm">결과물 안에서 평상시(중앙값 이하) 구간</text><text x="0" y="26" font-size="15" font-weight="500" class="t">방식</text><text x="0" y="46" font-size="12" class="tm">웃음 트리거 중심 고정창</text><line x1="236.0" y1="70" x2="236.0" y2="382" stroke="#c3c2b7" stroke-width="1" stroke-opacity="0.4"/><text x="236.0" y="64" text-anchor="middle" font-size="11" class="tm">0%</text><line x1="312.6" y1="70" x2="312.6" y2="382" stroke="#c3c2b7" stroke-width="1" stroke-opacity="0.4"/><text x="312.6" y="64" text-anchor="middle" font-size="11" class="tm">20%</text><line x1="389.1" y1="70" x2="389.1" y2="382" stroke="#c3c2b7" stroke-width="1" stroke-opacity="0.4"/><text x="389.1" y="64" text-anchor="middle" font-size="11" class="tm">40%</text><line x1="465.7" y1="70" x2="465.7" y2="382" stroke="#c3c2b7" stroke-width="1" stroke-opacity="0.4"/><text x="465.7" y="64" text-anchor="middle" font-size="11" class="tm">60%</text><line x1="544.0" y1="70" x2="544.0" y2="382" stroke="#c3c2b7" stroke-width="1" stroke-opacity="0.4"/><text x="544.0" y="64" text-anchor="middle" font-size="11" class="tm">0%</text><line x1="620.6" y1="70" x2="620.6" y2="382" stroke="#c3c2b7" stroke-width="1" stroke-opacity="0.4"/><text x="620.6" y="64" text-anchor="middle" font-size="11" class="tm">20%</text><line x1="697.1" y1="70" x2="697.1" y2="382" stroke="#c3c2b7" stroke-width="1" stroke-opacity="0.4"/><text x="697.1" y="64" text-anchor="middle" font-size="11" class="tm">40%</text><line x1="773.7" y1="70" x2="773.7" y2="382" stroke="#c3c2b7" stroke-width="1" stroke-opacity="0.4"/><text x="773.7" y="64" text-anchor="middle" font-size="11" class="tm">60%</text><text x="0" y="92" font-size="14" font-weight="400" class="t">웃음 트리거 ±7.5초</text><text x="0" y="109" font-size="12" font-family="Consolas,SFMono-Regular,monospace" class="tm">15.0초</text><rect x="236" y="82" width="234.3" height="22" rx="3" fill="#eb6834"/><text x="478.3" y="99" font-size="14" font-weight="500" font-family="Consolas,SFMono-Regular,monospace" fill="#eb6834">61.2%</text><rect x="544" y="82" width="76.6" height="22" rx="3" fill="#8a8880"/><text x="628.6" y="99" font-size="14" font-weight="500" font-family="Consolas,SFMono-Regular,monospace" fill="#8a8880">20.0%</text><text x="0" y="144" font-size="14" font-weight="400" class="t">웃음 트리거 ±11.25초</text><text x="0" y="161" font-size="12" font-family="Consolas,SFMono-Regular,monospace" class="tm">22.5초</text><rect x="236" y="134" width="211.3" height="22" rx="3" fill="#eb6834"/><text x="455.3" y="151" font-size="14" font-weight="500" font-family="Consolas,SFMono-Regular,monospace" fill="#eb6834">55.2%</text><rect x="544" y="134" width="95.3" height="22" rx="3" fill="#8a8880"/><text x="647.3" y="151" font-size="14" font-weight="500" font-family="Consolas,SFMono-Regular,monospace" fill="#8a8880">24.9%</text><rect x="-8" y="176" width="876" height="46" rx="6" fill="#2a78d6" fill-opacity="0.08"/><text x="0" y="196" font-size="14" font-weight="500" fill="#2a78d6">다중신호 선택</text><text x="0" y="213" font-size="12" font-family="Consolas,SFMono-Regular,monospace" class="tm">44.6초</text><rect x="236" y="186" width="131.3" height="22" rx="3" fill="#2a78d6"/><text x="375.3" y="203" font-size="14" font-weight="500" font-family="Consolas,SFMono-Regular,monospace" fill="#2a78d6">34.3%</text><rect x="544" y="186" width="134.0" height="22" rx="3" fill="#2a78d6"/><text x="686.0" y="203" font-size="14" font-weight="500" font-family="Consolas,SFMono-Regular,monospace" fill="#2a78d6">35.0%</text><text x="0" y="248" font-size="14" font-weight="400" class="t">웃음 트리거 ±25초</text><text x="0" y="265" font-size="12" font-family="Consolas,SFMono-Regular,monospace" class="tm">50.0초</text><rect x="236" y="238" width="154.3" height="22" rx="3" fill="#eb6834"/><text x="398.3" y="255" font-size="14" font-weight="500" font-family="Consolas,SFMono-Regular,monospace" fill="#eb6834">40.3%</text><rect x="544" y="238" width="159.3" height="22" rx="3" fill="#8a8880"/><text x="711.3" y="255" font-size="14" font-weight="500" font-family="Consolas,SFMono-Regular,monospace" fill="#8a8880">41.6%</text><text x="0" y="300" font-size="14" font-weight="400" class="t">웃음 트리거 ±47.5초</text><text x="0" y="317" font-size="12" font-family="Consolas,SFMono-Regular,monospace" class="tm">95.0초</text><rect x="236" y="290" width="68.5" height="22" rx="3" fill="#eb6834"/><text x="312.5" y="307" font-size="14" font-weight="500" font-family="Consolas,SFMono-Regular,monospace" fill="#eb6834">17.9%</text><rect x="544" y="290" width="179.6" height="22" rx="3" fill="#8a8880"/><text x="731.6" y="307" font-size="14" font-weight="500" font-family="Consolas,SFMono-Regular,monospace" fill="#8a8880">46.9%</text><text x="0" y="352" font-size="14" font-weight="400" class="t">웃음 트리거 ±60초 (통째로)</text><text x="0" y="369" font-size="12" font-family="Consolas,SFMono-Regular,monospace" class="tm">120.0초</text><rect x="236" y="342" width="2.0" height="22" rx="3" fill="#eb6834"/><text x="246.0" y="359" font-size="14" font-weight="500" font-family="Consolas,SFMono-Regular,monospace" fill="#eb6834">0.0%</text><rect x="544" y="342" width="176.1" height="22" rx="3" fill="#8a8880"/><text x="728.1" y="359" font-size="14" font-weight="500" font-family="Consolas,SFMono-Regular,monospace" fill="#8a8880">46.0%</text><text x="884" y="196" text-anchor="end" font-size="12" font-weight="500" fill="#2a78d6">↓ 바로 아래 50초 고정창보다</text><text x="884" y="212" text-anchor="end" font-size="12" font-weight="500" fill="#2a78d6">짧은데 둘 다 낮다</text><line x1="0" y1="404" x2="876" y2="404" stroke="#c3c2b7" stroke-width="1"/><text x="0" y="430" font-size="14" class="t">고정창은 짧으면 알맹이를 버리고, 길면 평상시를 데려온다. 둘 다 피할 수 없다.</text><text x="0" y="452" font-size="14" font-weight="500" fill="#2a78d6">다중신호 선택만 두 열에서 동시에 낮다 — 44.6초로 50초보다 짧으면서.</text></svg>
