<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 644" width="900" height="644" role="img" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,sans-serif">
<title>구간 시작 시각별 내용 점수 곡선</title><desc>가로축은 구간의 시작 시각, 세로축은 그 지점에서 정해진 길이만큼 잘랐을 때의 내용 점수다. 선택기가 이 값을 최대화하므로 네 영상 모두 곡선의 최고점에 앉는다. 아무 데나 자른 평균과 트리거 앞뒤로 자른 지점을 함께 표시해 차이를 보인다.</desc>
