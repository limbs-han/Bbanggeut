      type: object
      required: [cuts]
      properties:
        cuts:
          type: array
          minItems: 4
          maxItems: 4
          description: 항상 4개. 그림이 2×2 격자 한 장이라 칸 수가 고정이다.
          items:
            $ref: '#/components/schemas/ComicCut'

