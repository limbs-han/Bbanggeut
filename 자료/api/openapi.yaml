          format: byte
          description: 정사각 PNG의 순수 base64. `data:image/png;base64,` 접두어를 붙이지 않는다.

    SignedUrlResponse:
      type: object
      required: [url, expiresAt]
      properties:
        url:
          type: string
          format: uri
          description: 짧은 유효시간의 서명 URL. 만료 전 재사용될 수 있으므로 로그·DB에 저장하지 않는다.
        expiresAt:
          type: string
          format: date-time

    IotUploadUrlRequest:
      type: object
      required:
        - sourceEventId
        - triggerType
        - title
        - capturedStartAt
        - capturedEndAt
        - durationMs
        - contentType
        - sizeBytes
        - checksumSha256
      additionalProperties: false
      properties:
        sourceEventId:
          type: string
          minLength: 1
          maxLength: 100
          description: MQTT eventId와 같은 기기별 멱등 키
        triggerType:
          type: string
          enum: [LAUGHTER, CLAP, WAKE_WORD, TOUCH, MANUAL]
        eventTypes:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          description: 생략하면 triggerType 하나만 기록한다. triggerType을 반드시 포함한다.
          items:
            type: string
            enum: [LAUGHTER, CLAP, WAKE_WORD, TOUCH, MANUAL]
        title:
          type: string
          minLength: 1
          maxLength: 120
        capturedStartAt:
          type: string
          format: date-time
        capturedEndAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64
          minimum: 1
        contentType:
          type: string
          enum: [video/mp4]
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 524288000
          description: MVP 단일 PUT 최대 500 MiB
        checksumSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: 로컬 MP4 전체 파일의 SHA-256 lowercase hex digest

    IotUploadUrlResponse:
      type: object
      required: [videoId, alreadyCompleted]
      properties:
        videoId:
          type: string
          format: uuid
        alreadyCompleted:
          type: boolean
        uploadUrl:
          type: string
          format: uri
          nullable: true
          description: 최대 15분 유효한 단기 서명 URL. 만료 전 재사용될 수 있다.
        method:
          type: string
          enum: [PUT]
          nullable: true
        requiredHeaders:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: Content-Type과 저장소별 체크섬 헤더 또는 서명된 메타데이터를 포함한다.
          example:
            Content-Type: video/mp4
            x-amz-checksum-sha256: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        expiresAt:
          type: string
          format: date-time
          nullable: true
      description: 기존 완료 영상이면 `alreadyCompleted=true`이고 업로드 관련 필드는 null이다.

    IotUploadCompleteRequest:
      type: object
      required: [videoId]
      additionalProperties: false
      properties:
        videoId:
          type: string
          format: uuid
        objectETag:
          type: string
          maxLength: 200
          nullable: true
          description: 진단·조건부 요청 보조값. 파일 SHA-256 무결성 판정에는 사용하지 않는다.

    AccessLog:
      type: object
      required: [id, deviceId, action, targetType, outcome, createdAt]
      properties:
        id:
          type: integer
          format: int64
        deviceId:
          type: string
          format: uuid
        actorUserId:
          type: string
          format: uuid
          nullable: true
        actorDeviceId:
          type: string
          format: uuid
          nullable: true
        action:
          type: string
          description: "`VIDEO_EDIT`는 V13 이전 레거시 감사 로그에만 존재하며 신규 메타데이터 수정은 `VIDEO_UPDATE`로 기록한다."
          enum:
            - MEMBER_INVITE
            - MEMBER_REVOKE
            - DEVICE_CLAIM
            - DEVICE_UPDATE
            - DEVICE_REVOKE
            - VIDEO_LIST
            - VIDEO_VIEW
            - VIDEO_PLAY
            - VIDEO_DOWNLOAD
            - VIDEO_UPDATE
            - VIDEO_EDIT
            - VIDEO_DELETE
            - STREAM_OPEN
            - STREAM_HEARTBEAT
            - STREAM_CLOSE
        targetType:
          type: string
          maxLength: 40
        targetId:
          type: string
          format: uuid
          nullable: true
        outcome:
          type: string
          enum: [SUCCESS, DENIED, FAILED]
        reasonCode:
          type: string
          maxLength: 80
          nullable: true
        createdAt:
          type: string
          format: date-time

    Notification:
      type: object
      required: [id, type, title, body, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - INVITATION_RECEIVED
            - INVITATION_ACCEPTED
            - LAUGHTER_VIDEO_READY
            - EDIT_ANALYSIS_READY
            - EDIT_COMMENT_ADDED
            - ANNIVERSARY
            - WEEKLY_REPORT
        title:
          type: string
        body:
          type: string
        deviceId:
          type: string
          format: uuid
          nullable: true
        resourceId:
          type: string
          format: uuid
          nullable: true
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    UnreadNotificationCount:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          format: int64
          minimum: 0

    CreateEditUploadRequest:
      type: object
      properties:
        title: {type: string, maxLength: 120, description: 비우면 원본 제목을 쓴다}
        durationMs: {type: integer, format: int64, minimum: 1}
        capturedStartAt: {type: string, format: date-time, description: 비우면 원본 값을 물려받는다}
        capturedEndAt: {type: string, format: date-time}

    EditUpload:
      type: object
      required: [editVideoId, uploadUrl, uploadMethod, requiredHeaders, expiresAt]
      properties:
        editVideoId: {type: string, format: uuid}
        uploadUrl: {type: string}
        uploadMethod: {type: string, enum: [PUT]}
        requiredHeaders:
          type: object
          additionalProperties: {type: string}
          description: 서명에 포함된 헤더. 그대로 보내야 서명이 맞는다(Content-Type만).
        expiresAt: {type: string, format: date-time}

    VideoComment:
      type: object
      required: [id, authorId, body, createdAt]
      properties:
        id: {type: string, format: uuid}
        authorId: {type: string, format: uuid}
        authorName:
          type: string
          nullable: true
          description: 작성 직후 응답에서는 null이고, 목록 조회에서는 서버가 채운다.
        body: {type: string}
        createdAt: {type: string, format: date-time}

    VaultEventStats:
      type: object
      required: [vaultId, from, to, timeZone, detectedCount, uploadedVideoCount, byType, byDevice, dailyCounts]
      properties:
        vaultId:
          type: string
          format: uuid
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        timeZone:
          type: string
        detectedCount:
          type: integer
          format: int64
        uploadedVideoCount:
          type: integer
          format: int64
        byType:
          type: array
          items:
            type: object
            required: [name, count]
            properties:
              name: {type: string}
              count: {type: integer, format: int64}
        byDevice:
          type: array
          items:
            type: object
            required: [deviceId, name, count]
            properties:
              deviceId: {type: string, format: uuid}
              name: {type: string}
              count: {type: integer, format: int64}
        dailyCounts:
          type: array
          items:
            type: object
            required: [date, count]
            properties:
              date: {type: string, format: date}
              count: {type: integer, format: int64}

    NotificationPreferences:
      type: object
      required: [anniversaryAlerts, weeklyReport, newMemoryAlerts]
      properties:
        anniversaryAlerts:
          type: boolean
          description: 기념일 알림
        weeklyReport:
          type: boolean
          description: 주간 리포트 알림
        newMemoryAlerts:
          type: boolean
          description: 새 영상(추억) 저장 푸시

    ScheduleRequest:
      type: object
      required: [title, date]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
        date:
          type: string
          format: date
        memo:
          type: string
          maxLength: 500
          default: ''
        yearly:
          type: boolean
          default: false
          description: 매년 반복 여부
        emoji:
          type: string
          maxLength: 16
          default: '❤️'
        vaultId:
          type: string
          format: uuid
          nullable: true
          description: |
            일정을 넣을 금고. 생략하면 사용자가 속한 금고가 하나일 때만 그것으로
            정하고, 여러 곳에 속해 있으면 422로 되묻는다.

    PlaceLayout:
      type: object
      required: [places, devicePlaces, deviceOrder]
      properties:
        places:
          type: array
          description: 금고 공통 장소 이름(정렬 순서 그대로)
          items: {type: string, maxLength: 15}
        devicePlaces:
          type: object
          description: 금고 공통 — 기기 id를 장소 이름에 매핑
          additionalProperties: {type: string, maxLength: 15}
        deviceOrder:
          type: array
          description: 부른 사람만의 기기 순서. 비어 있으면 서버 기본 순서를 쓴다
          items: {type: string, format: uuid}

    UpdatePlaceLayoutRequest:
      type: object
      required: [places, devicePlaces]
      properties:
        places:
          type: array
          maxItems: 20
          items: {type: string, minLength: 1, maxLength: 15}
        devicePlaces:
          type: object
          additionalProperties: {type: string, maxLength: 15}

    Schedule:
      type: object
      required: [id, authorId, title, date, memo, yearly, emoji]
      properties:
        id:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
          description: |
            이 일정을 적은 사람. 앱이 "내가 적은 일정인가"를 보고 수정·삭제
            버튼을 가리는 데 쓴다. 서버도 같은 규칙으로 거른다.
        authorName:
          type: string
          nullable: true
          description: 적은 사람의 표시 이름. 서버가 `users`에서 조인해 준다.
        title:
          type: string
        date:
          type: string
          format: date
        memo:
          type: string
        yearly:
          type: boolean
        emoji:
          type: string

    RegisterPushTokenRequest:
      type: object
      required: [installationId, token, platform]
      properties:
        installationId:
          type: string
          minLength: 1
          maxLength: 128
          description: 앱 설치를 식별하는 안정적인 임의 ID
        token:
          type: string
          minLength: 1
          maxLength: 4096
          description: Firebase Messaging에서 발급한 등록 토큰
        platform:
          type: string
          enum: [ANDROID, IOS]

    AccessLogPage:
      type: object
      required: [items, hasNext]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccessLog'
        nextCursor:
          type: string
          nullable: true
        hasNext:
          type: boolean
