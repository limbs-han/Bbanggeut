      type: string
      enum: [LAUGHTER, CLAP, WAKE_WORD, TOUCH, MANUAL, USER_UPLOAD, EDIT]

    VideoStatus:
      type: string
      enum: [UPLOADING, PROCESSING, READY, FAILED, DELETING, DELETED]

    Video:
      type: object
      required:
        - id
        - deviceId
        - sourceType
        - triggerType
        - eventTypes
        - title
        - contentType
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        sourceType:
          $ref: '#/components/schemas/VideoSourceType'
        triggerType:
          $ref: '#/components/schemas/VideoTriggerType'
        eventTypes:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          description: 하나의 영상에 함께 기록된 이벤트 유형. triggerType을 반드시 포함한다.
          items:
            $ref: '#/components/schemas/VideoTriggerType'
        sourceEventId:
          type: string
          maxLength: 100
          nullable: true
        title:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 500
          nullable: true
        contentType:
          type: string
          example: video/mp4
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 524288000
          nullable: true
        checksumSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          nullable: true
        durationMs:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        capturedStartAt:
