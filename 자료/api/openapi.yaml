    MembershipStatus:
      type: string
      enum: [ACTIVE, REVOKED]

    DeviceLifecycleStatus:
      type: string
      enum: [UNCLAIMED, ONLINE, OFFLINE, REVOKED]

    DeviceSummary:
      type: object
      required: [id, name, model, status, myRole, retentionDays]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 80
        model:
          type: string
          maxLength: 80
        status:
          $ref: '#/components/schemas/DeviceLifecycleStatus'
        myRole:
          $ref: '#/components/schemas/DeviceRole'
        retentionDays:
          type: integer
          minimum: 1
          maximum: 3650
        lastSeenAt:
          type: string
          format: date-time
          nullable: true

    Device:
      allOf:
        - $ref: '#/components/schemas/DeviceSummary'
        - type: object
          required: [serialNumber, claimedAt]
          properties:
            serialNumber:
              type: string
              maxLength: 80
            firmwareVersion:
              type: string
              maxLength: 40
              nullable: true
            claimedAt:
              type: string
              format: date-time

    RegistrationCodeResponse:
      type: object
      required: [registrationCode, expiresAt]
      additionalProperties: false
      properties:
        registrationCode:
          type: string
          description: 표시용 평문 코드. 로그·DB에 저장하지 않는다.
          minLength: 8
          maxLength: 9
        expiresAt:
          type: string
          format: date-time

    ClaimDeviceRequest:
      type: object
      required: [registrationCode]
      additionalProperties: false
      properties:
        registrationCode:
          type: string
          description: 기기 화면에 표시된 8자리 1회용 코드. 하이픈·소문자는 서버가 정규화한다.
          minLength: 8
          maxLength: 9
        name:
          type: string
          minLength: 1
          maxLength: 80

    UpdateDeviceRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        retentionDays:
          type: integer
          minimum: 1
          maximum: 3650

    DeviceStatus:
      type: object
      required: [deviceId, status, recording, uploadQueueDepth, checkedAt]
      properties:
        deviceId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/DeviceLifecycleStatus'
        recording:
          type: boolean
        uploadQueueDepth:
          type: integer
          minimum: 0
        bufferSeconds:
          type: integer
          minimum: 0
          nullable: true
        personCount:
          type: integer
          minimum: 0
          nullable: true
          description: 홈캠 edge가 마지막 heartbeat에서 보고한 화면 내 감지 인원 수. 감지 미보고·프리즌스 비활성·오프라인이면 null. 인물 탐지·중심 계산은 edge에서만 수행하며 서버는 집계값만 전달한다.
        checkedAt:
          type: string
          format: date-time

    HomeSummary:
      type: object
      required: [deviceId, date, timeZone, captureCount, savedCount, memoCount]
      description: 홈 대시보드용 오늘 요약 집계. 현재 데이터 모델에서는 captureCount와 savedCount가 같은 값이며, edge가 원시 이벤트 수를 별도로 보고하면 분리된다.
      properties:
        deviceId:
          type: string
          format: uuid
        date:
          type: string
          format: date
          description: timeZone 기준 오늘 날짜
        timeZone:
          type: string
          default: Asia/Seoul
        captureCount:
          type: integer
          minimum: 0
          description: 오늘 포착된 순간(READY 영상) 수
        savedCount:
          type: integer
          minimum: 0
          description: 오늘 저장된 영상 수
        memoCount:
          type: integer
          minimum: 0
          description: 오늘 저장된 영상 중 메모(설명)가 작성된 수
        latestHighlight:
          type: object
          allOf:
            - $ref: '#/components/schemas/Video'
          nullable: true
          description: 즐겨찾기·최신 순서로 고른 대표 하이라이트. READY 영상이 없으면 null.

    TalkbackSession:
      type: object
      required:
        - sessionId
        - streamId
        - deviceId
        - whipUrl
        - heartbeatIntervalSeconds
        - expiresAt
      properties:
        sessionId:
          type: string
          format: uuid
          description: 발화 권한을 쥔 시청자 세션 ID
        streamId:
          type: string
          format: uuid
          description: 발화 경로가 붙는 edge 송출 ID. WHIP path는 이 값으로 결정된다.
        deviceId:
          type: string
          format: uuid
        whipUrl:
          type: string
          format: uri
          description: 오디오 전용 WebRTC WHIP 송출 URL. scope=TALK 단기 토큰이 붙으며 미디어 계층이 요청 시점에 발화 권한을 다시 확인한다. 앱 로그·분석 이벤트·DB에 저장하지 않는다.
        heartbeatIntervalSeconds:
          type: integer
          enum: [15]
          description: 발화 권한도 이 주기의 시청자 heartbeat로 함께 연장된다.
        expiresAt:
          type: string
          format: date-time
          description: 발화 권한 만료 시각. heartbeat가 끊기면 서버가 회수하고 기기에 STOP_TALKBACK을 보낸다.

    StreamSession:
      type: object
      required:
        - sessionId
        - streamId
        - deviceId
        - status
        - heartbeatIntervalSeconds
        - viewerExpiresAt
        - edgeHardExpiresAt
        - createdAt
      properties:
        sessionId:
          type: string
          format: uuid
          description: 앱 시청자 한 명의 세션 ID
        streamId:
          type: string
          format: uuid
          description: 같은 기기의 여러 시청자 세션이 공유하는 edge 송출 ID
        deviceId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, READY, FAILED, CLOSED, EXPIRED]
        whepUrl:
          type: string
          format: uri
          nullable: true
          description: READY 상태에서 제공되는 단방향 WebRTC WHEP URL. 운영 라이브 API가 반환하는 유일한 재생 URL이며 HLS 폴백은 제공하지 않는다. 미디어 계층은 introspection으로 세션 소유자와 ACTIVE 멤버십을 확인해 CLOSED/EXPIRED/권한 회수 뒤의 새 요청을 차단한다. URL은 앱 로그·분석 이벤트·DB에 저장하지 않는다.
        heartbeatIntervalSeconds:
          type: integer
          enum: [15]
          description: 앱 heartbeat 권장 주기
        viewerExpiresAt:
          type: string
          format: date-time
          description: heartbeat로 연장되는 시청자 세션 TTL. 생성 시 createdAt+45초이며 약 45초 미수신 시 만료 처리한다.
        edgeHardExpiresAt:
          type: string
          format: date-time
          description: STOP 유실에 대비해 edge가 송출을 강제 종료하는 시각. 기본 lease는 120초이며 활성 시청자가 있으면 서버가 만료 전에 연장 명령을 보낸다.
        failureCode:
          type: string
          maxLength: 80
          nullable: true
        createdAt:
          type: string
          format: date-time

    Vault:
      type: object
      required: [id, name, status, myRole, retentionDays, subscriptionActive, devices]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 80
        status:
          type: string
          enum: [ACTIVE, CLOSING, CLOSED]
        myRole:
