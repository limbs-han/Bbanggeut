          type: string
        expiresAt:
          type: string
          format: date-time

    Invitation:
      type: object
      required: [id, inviteeEmail, role, status, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
          nullable: true
          description: 초대 당시 금고에 연결된 기기가 없었으면 null이다.
        deviceName:
          type: string
          nullable: true
        vaultId:
          type: string
          format: uuid
          description: 초대가 귀속된 추억 금고. V30 이후 모든 초대가 값을 가진다.
        vaultName:
          type: string
          nullable: true
        inviteeEmail:
          type: string
          format: email
        role:
          type: string
          enum: [MEMBER]
        inviter:
          $ref: '#/components/schemas/UserSummary'
          nullable: true
        status:
          type: string
          enum: [PENDING, ACCEPTED, DECLINED, EXPIRED, REVOKED]
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    Subscription:
      type: object
      required: [active, premiumRetentionDays]
      properties:
        deviceId:
          type: string
          format: uuid
          nullable: true
          description: 금고 경로로 조회하면 null이다.
        vaultId:
          type: string
          format: uuid
          nullable: true
          description: 기기 경로로 조회하면 null이다.
        active:
          type: boolean
        graceUntil:
          type: string
          format: date-time
          nullable: true
          description: 해지 후 유예 만료 시각. 활성 구독이거나 유예가 없으면 null.
        premiumRetentionDays:
          type: integer
          description: 구독 활성 시 영상 보관 일수(기본 365).

    VideoSourceType:
      type: string
      enum: [IOT_CAPTURE, USER_UPLOAD, EDIT_OUTPUT]
      description: "EDIT_OUTPUT은 V13 이전 레거시 조회 호환 값이며 신규 편집본에는 사용하지 않는다."

