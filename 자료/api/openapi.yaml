    CreateInvitationRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        membershipRequestToken:
          type: string
          maxLength: 200
          nullable: true
          description: 멤버 요청 링크에서 진입했을 때만 전달하는 불투명 토큰

    MembershipRequestLink:
      type: object
      required: [token, expiresAt]
      properties:
        token:
