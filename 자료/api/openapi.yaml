openapi: 3.0.3
info:
  title: William James API
  version: 1.2.0
  description: |
    웃음·호출어·터치 이벤트로 생성된 영상을 관리하는 모바일·IoT API다.

    권한의 기준은 기기다. 사용자와 기기는 `DeviceMembership`으로 다대다 연결되며,
    사용자는 여러 기기에 서로 다른 역할로 참여할 수 있고 한 기기도 여러 사용자가 공유할 수 있다.

    - Flutter 앱은 `UserBearerAuth` JWT를 사용한다.
    - IoT 기기는 사용자 JWT와 분리된 `DeviceBearerAuth` 자격 증명을 사용한다.
    - 대상 기기의 활성 멤버십이 없으면 정보 은닉을 위해 404로 응답한다.
    - 같은 기기의 활성 구성원이지만 OWNER 전용 작업을 수행할 역할이 부족하면 403으로 응답한다.
    - 객체 저장소는 비공개이며 권한 확인 후 단기 서명 URL만 발급한다.
    - IoT 영상 업로드는 MVP에서 단일 PUT, 파일당 최대 500 MiB다.
servers:
  - url: /
    description: 현재 문서 호스트와 동일한 서버. 실제 API 배포 후 운영 URL로 교체한다.
tags:
  - name: Auth
    description: 사용자 가입·로그인·토큰 회전·로그아웃
  - name: Devices
    description: 사용자가 접근 가능한 기기, 기기 등록과 기기별 구성원 관리
  - name: Streaming
    description: 활성 시청자가 있을 때만 동작하는 실시간 보기 세션
  - name: Invitations
    description: OWNER가 특정 이메일 계정을 초대하고 초대받은 사용자가 앱에서 수락·거절하는 구성원 관리
  - name: Videos
    description: 기기별 영상 조회·재생·원본 다운로드·삭제. 일반 편집은 앱 로컬 처리
  - name: IoT
    description: 기기 자격 증명을 사용하는 영상 직접 업로드 계약
  - name: Vaults
    description: 영상·구독·구성원의 소유 단위인 추억 금고. 연결된 기기가 없어도 유지된다
  - name: Audit
    description: OWNER가 확인하는 기기별 접근 감사 기록

  - name: Notifications
    description: In-app and FCM invitation and laughter-video notifications

security:
  - UserBearerAuth: []

paths:
  /api/auth/signup:
    post:
      tags: [Auth]
      operationId: signUp
      summary: 회원 가입
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: 가입 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 로그인
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: 이메일 또는 접속 주소 기준 로그인 실패 5회/10분 제한 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: 토큰 재발급
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: 재발급 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 현재 세션 로그아웃
      responses:
        '204':
          description: 로그아웃 완료
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/password/change:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change the signed-in user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed; other sessions were revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/auth/password/forgot:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Request a password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Accepted regardless of whether the account exists
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Reset a password using a one-time token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password reset; all sessions were revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/auth/me:
    delete:
      tags: [Auth]
      operationId: withdrawAccount
      summary: 회원 탈퇴
      description: |
        활성 `OWNER` 멤버십이 하나라도 있으면 409로 거부한다 — 먼저 기기를 해제하거나
        소유권을 넘겨야 한다. 성공 시 모든 MEMBER 멤버십과 로그인 세션을 회수하고
        계정을 `WITHDRAWN` 처리한다.
      responses:
        '204':
          description: 탈퇴 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 소유 중인 기기가 있어 탈퇴 불가 (OWNER_MEMBERSHIP_EXISTS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: 인앱 알림 목록 조회
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Newest notifications first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'

  /api/notifications/unread-count:
    get:
      tags: [Notifications]
      operationId: countUnreadNotifications
      summary: 읽지 않은 알림 수 조회
      responses:
        '200':
          description: Unread notification count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadNotificationCount'

  /api/notifications/{notificationId}/read:
    patch:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: 알림 하나를 읽음 처리
      parameters:
        - in: path
          name: notificationId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Marked as read
        '404':
          $ref: '#/components/responses/HiddenNotFound'

  /api/notifications/read-all:
    patch:
      tags: [Notifications]
      operationId: markAllNotificationsRead
      summary: 모든 알림을 읽음 처리
      responses:
        '204':
          description: All notifications marked as read

  /api/notifications/push-tokens:
    put:
      tags: [Notifications]
      operationId: registerPushToken
      summary: FCM 토큰 등록 또는 갱신
      description: |
        앱 설치별 FCM 토큰을 현재 로그인 사용자에게 연결한다. 같은 설치의 토큰이
        갱신되거나 같은 토큰으로 사용자가 전환되면 기존 연결을 안전하게 교체한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPushTokenRequest'
      responses:
        '204':
          description: 등록 또는 갱신 완료
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/notifications/push-tokens/{installationId}:
    delete:
      tags: [Notifications]
      operationId: unregisterPushToken
      summary: FCM 토큰 연결 해제
      description: 로그아웃하거나 알림 수신을 해제할 때 현재 사용자의 앱 설치 연결을 제거한다.
      parameters:
        - in: path
          name: installationId
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        '204':
          description: 연결 해제 완료
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/notifications/preferences:
    get:
      tags: [Notifications]
      operationId: getNotificationPreferences
      summary: 알림 설정 조회
      description: |
        기념일·주간 리포트·새로운 추억 푸시 토글. 저장된 행이 없으면 모두
        켜진 기본값을 반환한다.
      responses:
        '200':
          description: 현재 알림 설정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Notifications]
      operationId: updateNotificationPreferences
      summary: 알림 설정 저장
      description: |
        세 토글을 한 번에 저장한다. `newMemoryAlerts`를 끄면 새 영상
        푸시(LAUGHTER_VIDEO_READY)가 발송 대상에서 제외된다. 인앱 알림
        목록에는 계속 쌓인다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferences'
      responses:
        '200':
          description: 저장된 알림 설정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/schedules:
    get:
      tags: [Schedules]
      operationId: listSchedules
      summary: 캘린더 일정 목록
      description: |
        일정은 금고 구성원이 함께 본다. 사용자가 활성 구성원인 모든 금고의
        일정을 날짜 오름차순으로 반환한다.

        금고가 없던 시절에 적은 일정(`vaultId` 없음)은 적은 사람에게만 보인다.
      responses:
        '200':
          description: 일정 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Schedule'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Schedules]
      operationId: createSchedule
      summary: 캘린더 일정 등록
      description: |
        금고 구성원 누구나 등록한다. 금고당 최대 200개다.

        `vaultId`를 보내면 그 금고의 활성 구성원인지 확인한다. 생략하면 사용자가
        속한 금고가 하나일 때만 그것으로 정하고, 여러 곳에 속해 있으면 422로
        되묻는다. 금고가 하나도 없으면 예전처럼 개인 일정이 된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleRequest'
      responses:
        '201':
          description: 생성된 일정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/schedules/{scheduleId}:
    put:
      tags: [Schedules]
      operationId: updateSchedule
      summary: 캘린더 일정 수정
      description: 일정을 적은 사람 또는 금고 OWNER만 수정한다.
      parameters:
        - in: path
          name: scheduleId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleRequest'
      responses:
        '200':
          description: 수정된 일정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
    delete:
      tags: [Schedules]
      operationId: deleteSchedule
      summary: 캘린더 일정 삭제
      description: 일정을 적은 사람 또는 금고 OWNER만 삭제한다.
      parameters:
        - in: path
          name: scheduleId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 삭제 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HiddenNotFound'

  /api/devices:
    get:
      tags: [Devices]
      operationId: listMyDevices
      summary: 내가 접근할 수 있는 기기 목록
      description: 로그인 사용자의 `ACTIVE DeviceMembership`이 있는 기기만 반환한다.
      responses:
        '200':
          description: 기기 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/devices/claim:
    post:
      tags: [Devices]
      operationId: claimDevice
      summary: 최초 기기 등록
      description: |
        기기 화면(7" LCD)에 표시된 1회용 등록 코드를 제출한다. 서버는 코드 해시 역조회로
        대상 기기를 특정한 뒤 코드의 120초 TTL·미사용 여부, 기기의 미등록 상태와 시도 횟수를 확인한다.
        성공하면 코드를 사용 처리하고 요청 사용자를 해당 기기의 유일한 활성 OWNER로 등록한 뒤
        운영용 기기 자격 증명을 교체한다. 이 과정은 한 트랜잭션이다.
        실패는 계정·IP당 5회/10분으로 제한하며 초과 시 429를 반환한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimDeviceRequest'
      responses:
        '201':
          description: 등록 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: 계정·접속 주소 기준 등록 실패 5회/10분 제한 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/devices/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Devices]
      operationId: getDevice
      summary: 기기 상세 조회
      responses:
        '200':
          description: 기기 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
    patch:
      tags: [Devices]
      operationId: updateDevice
      summary: 기기 설정 수정
      description: 해당 기기의 활성 OWNER만 수행할 수 있다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceRequest'
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Devices]
      operationId: revokeDevice
      summary: 기기 등록 해제
      description: |
        해당 기기의 활성 OWNER만 수행할 수 있다. 멤버십·기기 HTTP Credential·MQTT
        identity를 폐기하고 영상을 비동기로 삭제한다. 같은 물리 기기를 다시 사용하려면
        새 device identity와 bootstrap credential을 발급하는 재프로비저닝이 필요하다.
      responses:
        '204':
          description: 등록 해제 요청 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/HiddenNotFound'

  /api/devices/{deviceId}/transfer-ownership:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [Devices]
      operationId: transferOwnership
      summary: 기기 소유권 이전
      description: |
        현재 OWNER가 같은 기기의 활성 MEMBER에게 소유권을 넘긴다. 한 트랜잭션에서
        기존 OWNER는 MEMBER로 강등되고 대상이 OWNER로 승격된다. 영상·구성원·설정·구독은
        모두 유지된다(기기 행 불변). 외부인에게 넘기려면 먼저 초대·승인으로 구성원으로
        만든다. 외부인에게 물리 기기 자체를 넘길 때는 기기 해제 후 재프로비저닝한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferOwnershipRequest'
      responses:
        '204':
          description: 소유권 이전 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
        '409':
          description: 대상이 활성 MEMBER가 아니거나 본인임
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/devices/{deviceId}/status:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Devices]
      operationId: getDeviceStatus
      summary: 기기 상태 조회
      responses:
        '200':
          description: 최신 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HiddenNotFound'

  /api/devices/{deviceId}/home-summary:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Devices]
      operationId: getHomeSummary
      summary: 홈 대시보드 오늘 요약 조회
      description: 홈캠 대시보드 상단의 "오늘의 순간 요약" 카드를 한 번의 호출로 채운다. timeZone 기준 오늘의 포착·저장·메모 수와 대표 하이라이트를 반환한다.
      parameters:
        - name: timeZone
          in: query
          required: false
          schema:
            type: string
            default: Asia/Seoul
      responses:
        '200':
          description: 오늘 요약
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/devices/{deviceId}/stats:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Devices]
      operationId: getDeviceVideoStats
      summary: 저장 영상 통계 조회
      description: 활성 멤버십 기기의 READY 영상만 집계한다. 기본 기간은 Asia/Seoul 기준 최근 30일이다.
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: timeZone
          in: query
          required: false
          schema:
            type: string
            default: Asia/Seoul
      responses:
        '200':
          description: 감지 유형·일자별 집계와 최다 요일·시간대
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/devices/{deviceId}/event-stats:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Devices]
      operationId: getDeviceEventStats
      summary: 원시 감지 이벤트 통계 조회
      description: |
        활성 OWNER 또는 MEMBER가 조회한다. 영상 업로드 성공 여부와 무관한 원시 감지 횟수,
        READY 영상 연결 수, 유형별·일자별 집계를 반환한다. 기본 기간은 최근 30일이며 최대 366일이다.
      parameters:
        - name: from
          in: query
          schema: {type: string, format: date}
        - name: to
          in: query
          schema: {type: string, format: date}
        - name: timeZone
          in: query
          schema: {type: string, default: Asia/Seoul}
        - name: type
          in: query
          description: 이벤트 타입 필터(예 LAUGHTER). detectedCount·dailyCounts만 거르고 byType은 전체 분포를 유지한다.
          schema: {type: string, pattern: '^[A-Za-z_]{1,32}$'}
      responses:
        '200':
          description: 원시 감지 및 업로드 성공 집계
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/devices/{deviceId}/stream-sessions:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [Streaming]
      operationId: createStreamSession
      summary: 온디맨드 실시간 보기 세션 시작
      description: |
        OWNER 또는 MEMBER의 활성 기기 멤버십을 확인한 뒤 시청자 세션을 만든다.
        이미 같은 기기의 송출이 있으면 하나의 edge 송출을 여러 시청자가 공유하고 MQTT START를 다시 보내지 않는다.
        최초 시청자는 MQTT START 후 WHEP 송출이 준비될 때까지 수초간 `PENDING`일 수 있다.

        앱은 응답의 주기(권장 15초)로 heartbeat를 보내야 한다. 마지막 시청 활동 시각
        (유효 heartbeat 또는 정상 종료)을 기준으로 60초 동안 새 시청자가 없으면 서버가 MQTT STOP을 보낸다.
        생성 직후 첫 heartbeat 전에는 `createdAt`을 초기 `lastActivityAt`으로 사용해
        `viewerExpiresAt=createdAt+45초`, STOP deadline=`createdAt+60초`로 계산한다.
        heartbeat가 45초 끊긴 세션을 먼저 만료시키되 idle 시간을 추가로 60초 더하지 않는다. 세션 상태 저장소는
        인메모리·DB 등 구현 선택이며 Redis를 필수로 요구하지 않는다. edge 송출은 기본 120초의
        hard timeout을 가지며 활성 시청자가 있으면 서버가 `hardExpiresAt`을 만료 전에 연장한다.
      responses:
        '202':
          description: 시청자 세션 생성. `PENDING`이면 상태 API를 폴링한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/stream-sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/StreamSessionId'
    get:
      tags: [Streaming]
      operationId: getStreamSession
      summary: 실시간 보기 세션 상태 조회
      description: |
        JWT 사용자가 이 세션을 만든 사용자와 같은지, 세션이 속한 기기의 활성 멤버십이 유지되는지를
        매 요청마다 모두 확인한다. 다른 사용자의 sessionId 또는 회수된 멤버십은 404로 숨긴다.
        준비되면 해당 시청자에게만 단기 WHEP URL을 반환한다.
      responses:
        '200':
          description: 세션 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
    delete:
      tags: [Streaming]
      operationId: closeStreamSession
      summary: 실시간 보기 정상 종료
      description: |
        JWT 사용자가 만든 세션이고 대상 기기의 활성 멤버십도 유지될 때만 세션을 `CLOSED`로 바꾼다.
        다른 사용자의 sessionId 또는 회수된 멤버십은 404로 숨긴다. 다른 시청자가 있으면 기기 송출은 유지한다.
        마지막 시청자라면 정상 종료 시각을 기준으로 60초 idle timeout을 시작하고,
        그 안에 새 세션이 없을 때 MQTT STOP을 보낸다.
      responses:
        '204':
          description: 시청자 세션 종료 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HiddenNotFound'

  /api/stream-sessions/{sessionId}/heartbeat:
    parameters:
      - $ref: '#/components/parameters/StreamSessionId'
    post:
      tags: [Streaming]
      operationId: heartbeatStreamSession
      summary: 실시간 보기 시청자 heartbeat
      description: |
        앱은 15초마다 호출한다. 서버는 시청자 TTL을 갱신하며, heartbeat가 약 45초 동안 없으면
        비정상 종료된 세션을 `EXPIRED`로 회수한다. 마지막 시청자의 경우 마지막 유효 heartbeat부터
        총 60초가 되는 시점에 STOP하도록 예약하며, 45초 만료 뒤 60초를 추가하지 않는다.
        JWT 사용자가 이 세션을 만든 사용자와 같은지와 세션 기기의 활성 멤버십을 모두 다시 확인한다.
        다른 사용자의 sessionId 또는 회수된 멤버십은 404로 숨긴다.
      responses:
        '204':
          description: heartbeat 반영 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HiddenNotFound'

  /api/stream-sessions/{sessionId}/talkback:
    parameters:
      - $ref: '#/components/parameters/StreamSessionId'
    post:
      tags: [Streaming]
      operationId: openTalkback
      summary: 양방향 오디오 발화 시작
      description: |
        앱 마이크 오디오를 기기 스피커로 보내기 위한 WHIP 송출 URL을 발급한다.
        세션이 `READY`이고 시청자 TTL이 남아 있어야 한다. 기기당 동시에 한 명만 말할 수 있으며,
        다른 구성원이 유효한 발화 권한을 쥐고 있으면 409 `TALKBACK_BUSY`로 거절한다.
        발화 권한은 시청자 heartbeat로 함께 연장되고, 갱신이 끊기면 30초 뒤 서버가 회수하며
        기기에 MQTT `STOP_TALKBACK`을 보낸다.

        발급 토큰의 scope는 `TALK`이며 WHEP 재생 토큰으로는 이 경로를 통과할 수 없다.
        기기에는 에코 제거가 없다. 앱은 발화하는 동안 자신의 WHEP 재생을 뮤트해
        기기 스피커에서 마이크로 돌아오는 순환을 끊어야 한다.
      responses:
        '200':
          description: 발화 권한 획득. `whipUrl`로 오디오 전용 WebRTC 송출을 시작한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TalkbackSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Streaming]
      operationId: closeTalkback
      summary: 양방향 오디오 발화 종료
      description: |
        발화 권한을 즉시 반납하고 기기에 MQTT `STOP_TALKBACK`을 보낸다. 권한을 쥐고 있지 않아도
        204를 반환한다. 라이브 세션을 `DELETE`하면 발화 권한도 함께 반납된다.
      responses:
        '204':
          description: 발화 종료 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HiddenNotFound'

  /api/devices/{deviceId}/members:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Devices]
      operationId: listDeviceMembers
      summary: 기기 구성원 목록
      responses:
        '200':
          description: 활성 구성원 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HiddenNotFound'

  /api/devices/{deviceId}/members/{membershipId}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/MembershipId'
    delete:
      tags: [Devices]
      operationId: revokeDeviceMember
      summary: 구성원 접근 권한 회수
      description: 활성 OWNER만 MEMBER를 회수할 수 있다. 다른 기기의 멤버십 ID도 404로 응답한다.
      responses:
        '204':
          description: 권한 회수 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/devices/{deviceId}/invitations:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [Invitations]
      operationId: createInvitation
      summary: 이메일 계정으로 MEMBER 초대
      description: |
        활성 OWNER가 특정 이메일 계정을 초대한다. 공개 링크나 전달 가능한 토큰은 만들지 않는다.
        초대 이메일은 현재 가입 상태가 ACTIVE인 계정이어야 한다.
        초대받은 이메일로 로그인한 사용자만 앱의 받은 초대함에서 수락할 수 있다.
        멤버 요청 링크에서 진입한 경우 membershipRequestToken을 함께 보내 요청을 1회 소비한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: 대기 중인 초대
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          description: 기기를 찾을 수 없거나 가입된 초대 대상이 없음 (`INVITEE_ACCOUNT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      tags: [Invitations]
      operationId: listDeviceInvitations
      summary: 기기의 대기 중 초대 목록
      description: 활성 OWNER만 조회할 수 있다.
      responses:
        '200':
          description: 대기 중 초대 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/HiddenNotFound'

  /api/devices/{deviceId}/invitations/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/InvitationId'
    delete:
      tags: [Invitations]
      operationId: revokeInvitation
      summary: 대기 중 초대 취소
      description: 활성 OWNER만 수행할 수 있다.
      responses:
        '204':
          description: 초대 취소 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/invitations:
    get:
      tags: [Invitations]
      operationId: listMyInvitations
      summary: 내 받은 초대함
      description: 로그인 계정 이메일과 일치하는 유효한 PENDING 초대만 반환한다.
      responses:
        '200':
          description: 받은 초대 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/membership-request-links:
    post:
      tags: [Invitations]
      operationId: createMembershipRequestLink
      summary: 멤버 초대 요청 링크 생성
      description: |
        로그인 사용자가 OWNER에게 전달할 24시간짜리 1회용 요청 토큰을 만든다.
        링크는 카메라 접근 권한을 부여하지 않으며 이메일 원문을 포함하지 않는다.
        새 링크를 만들면 이전 미사용 링크는 폐기된다.
      responses:
        '201':
          description: 요청 링크 구성에 사용할 불투명 토큰
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipRequestLink'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/membership-request-links/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          maxLength: 200
    get:
      tags: [Invitations]
      operationId: previewMembershipRequest
      summary: 멤버 요청자 확인
      description: 활성 기기 OWNER만 요청자의 이메일과 표시 이름을 확인할 수 있다.
      responses:
        '200':
          description: OWNER 초대 화면에 채울 요청자 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipRequestPreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/HiddenNotFound'

  /api/membership-request-links/{token}/open:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
    get:
      tags: [Invitations]
      operationId: openMembershipRequest
      summary: 앱 멤버 요청 화면으로 이동
      description: 인증 없이 HTTPS 공유 링크를 앱의 custom scheme으로 리다이렉트한다. 이메일이나 요청자 정보는 반환하지 않는다.
      security: []
      responses:
        '302':
          description: bbanggeut://membership-request/{token}으로 이동
          headers:
            Location:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/HiddenNotFound'

  /api/invitations/{invitationId}/accept:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    post:
      tags: [Invitations]
      operationId: acceptInvitation
      summary: 이메일 초대 수락
      description: 초대 대상 이메일 계정만 수행할 수 있으며 초대에 지정된 MEMBER 멤버십을 생성하거나 재활성화한다.
      responses:
        '200':
          description: 초대 수락 및 멤버십 활성화
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/invitations/{invitationId}/decline:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    post:
      tags: [Invitations]
      operationId: declineInvitation
      summary: 이메일 초대 거절
      description: 초대 대상 이메일 계정만 수행할 수 있다.
      responses:
        '204':
          description: 초대 거절 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/devices/{deviceId}/subscription:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Devices]
      operationId: getSubscription
      summary: 기기 구독(멤버십) 상태 조회
      responses:
        '200':
          description: 구독 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
    put:
      tags: [Devices]
      operationId: activateSubscription
      summary: 기기 구독 시작
      description: |
        활성 OWNER만 수행한다. 결제는 MVP 범위 밖이며 이 API는 구독 상태 전환만 담당한다.
        활성화 시 기기 영상의 보관 만료가 프리미엄 보관 기간(기본 365일)으로 연장된다.
        기존 만료 시각을 줄이지는 않는다.
      responses:
        '200':
          description: 구독 활성화
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
    delete:
      tags: [Devices]
      operationId: cancelSubscription
      summary: 기기 구독 해지
      description: |
        활성 OWNER만 수행한다. 해지 시 영상을 즉시 삭제하지 않는다 — 각 영상의 보관 만료는
        `max(기본 보관 기준, 해지일+유예 30일)`로 재계산되어 유예 기간 동안 시청·다운로드가 가능하고,
        유예 안에 재구독하면 그대로 복구된다. 만료된 영상은 보관 만료 스케줄러가 삭제한다.
      responses:
        '200':
          description: 구독 해지(유예 시작)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
        '409':
          description: 활성 구독이 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/videos:
    get:
      tags: [Videos]
      operationId: listVideos
      summary: 기기 영상 목록
      description: "`deviceId`에 대한 활성 멤버십을 검사한 뒤 영상 목록을 반환한다."
      parameters:
        - $ref: '#/components/parameters/DeviceIdQuery'
        - $ref: '#/components/parameters/TriggerTypeQuery'
        - name: from
          in: query
          required: false
          description: 촬영 시작 시각 하한(포함)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: 촬영 시작 시각 상한(미포함)
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 영상 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HiddenNotFound'

  /api/videos/{videoId}:
    parameters:
      - $ref: '#/components/parameters/VideoId'
    get:
      tags: [Videos]
      operationId: getVideo
      summary: 영상 상세 조회
      responses:
        '200':
          description: 영상 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
    patch:
      tags: [Videos]
      operationId: updateVideo
      summary: 영상 제목·설명·즐겨찾기 수정
      description: |
        필드마다 권한이 다르다.

        - 제목·설명: 기기가 담아 온 원본은 OWNER만 바꾼다(가족 공동의 기록이다).
          `sourceType=EDIT_OUTPUT`인 편집본은 OWNER와 MEMBER가 바꾼다.
        - 즐겨찾기: OWNER와 MEMBER 모두 토글한다.

        설명(메모)은 앱에서 걷어낸 기능이다. 필드는 하위 호환을 위해 남아 있다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVideoRequest'
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Videos]
      operationId: deleteVideo
      summary: 영상 삭제 요청
      description: |
        기기가 담아 온 원본은 OWNER만 지운다 — 지우면 가족 모두가 그 기록을 잃는다.

        `sourceType=EDIT_OUTPUT`인 편집본은 만든 사람 또는 OWNER가 지운다.
        구성원이 만든 편집본을 스스로 치울 수 있어야 하고, 남의 편집본은
        건드리지 못한다.
      responses:
        '202':
          description: 비동기 삭제 요청 수락
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/HiddenNotFound'

  /api/videos/{videoId}/play-url:
    parameters:
      - $ref: '#/components/parameters/VideoId'
    post:
      tags: [Videos]
      operationId: createVideoPlayUrl
      summary: 단기 재생 URL 발급
      responses:
        '200':
          description: 단기 재생 URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedUrlResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/videos/{videoId}/download-url:
    parameters:
      - $ref: '#/components/parameters/VideoId'
    post:
      tags: [Videos]
      operationId: createVideoDownloadUrl
      summary: 단기 다운로드 URL 발급
      responses:
        '200':
          description: 단기 다운로드 URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedUrlResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/videos/{videoId}/comic/script:
    parameters:
      - $ref: '#/components/parameters/VideoId'
    post:
      tags: [Videos]
      operationId: createComicScript
      summary: 4컷 만화 구성 만들기
      description: |
        기기에서 만든 전사문을 보내 4컷 구성(흐름·장면·대사)을 글로 받는다. 서버가 원본에서
        프레임 4~6장을 뽑아 함께 모델에 넣는다. 사용자가 대사를 고친 뒤 `comic/image`를 부른다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComicScriptRequest'
      responses:
        '200':
          description: 정확히 4개의 컷
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComicScriptResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: 전사문 형식 오류(`VALIDATION_FAILED`) 또는 만화 재료 부족(`COMIC_UNPROCESSABLE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 사용자·영상 기준 호출 예산 초과(`COMIC_RATE_LIMITED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/videos/{videoId}/comic/image:
    parameters:
      - $ref: '#/components/parameters/VideoId'
    post:
      tags: [Videos]
      operationId: createComicImage
      summary: 4컷 만화 그림 받기
      description: |
        사용자가 고친 4컷으로 2×2 격자 만화 한 장을 받는다. 대사는 그림에 그리지 않는다 —
        앱이 각 칸 아래 자막 띠로 얹는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComicImageRequest'
      responses:
        '200':
          description: 정사각 PNG 한 장
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComicImageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: 컷이 4개가 아님·`beat`/`scene` 누락·지원하지 않는 `style`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 사용자·영상 기준 호출 예산 초과(`COMIC_RATE_LIMITED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/iot/registration-codes:
    post:
      tags: [IoT]
      operationId: issueRegistrationCode
      summary: IoT 1회용 등록 코드 발급
      description: |
        기기가 물리 버튼으로 등록 모드에 진입할 때 호출한다. `DeviceBearerAuth`로 인증한 기기가
        `UNCLAIMED` 상태일 때만 허용한다. 서버는 CSPRNG로 8자리 등록 코드를 생성해
        (혼동 문자를 제외한 대문자·숫자 32자 문자셋, 활성 코드 간 유일성 보장) 해시만 저장하고
        평문은 이 응답에만 담는다. 기기는 코드를 7" LCD에 `XXXX-XXXX` 형식으로 표시한다.
        코드와 등록 모드는 120초 후 만료되며, 재진입 시 항상 새 코드가 발급되고 이전 코드는 무효가 된다.
      security:
        - DeviceBearerAuth: []
      responses:
        '200':
          description: 새 등록 코드
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationCodeResponse'
        '401':
          $ref: '#/components/responses/DeviceUnauthorized'
        '409':
          description: 이미 등록된 기기(UNCLAIMED가 아님)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/iot/videos/upload-url:
    post:
      tags: [IoT]
      operationId: createIotVideoUploadUrl
      summary: IoT 영상 단기 업로드 URL 발급
      description: |
        `DeviceBearerAuth`로 인증한 기기 ID를 서버가 결정한다. 요청 본문에서 deviceId를 받지 않는다.
        같은 `(deviceId, sourceEventId)` 재시도에는 같은 videoId를 반환한다.

        MVP는 최대 500 MiB의 단일 PUT만 지원한다. 응답의 `requiredHeaders`를 PUT 요청에 그대로
        포함해야 한다. 저장소가 체크섬 헤더를 지원하면 `x-amz-checksum-sha256`을 사용하고,
        그렇지 않으면 서명된 `x-amz-meta-sha256` 메타데이터를 사용한다.
      security:
        - DeviceBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IotUploadUrlRequest'
      responses:
        '200':
          description: 기존 멱등 결과 또는 새 단기 업로드 URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IotUploadUrlResponse'
        '401':
          $ref: '#/components/responses/DeviceUnauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/iot/videos/complete:
    post:
      tags: [IoT]
      operationId: completeIotVideoUpload
      summary: IoT 영상 업로드 완료 통지
      description: |
        서버는 `DeviceBearerAuth`의 기기와 videoId의 소유 기기가 같은지 확인한다. 그 뒤 객체 저장소
        `HEAD`를 호출해 Content-Length와 업로드 URL 발급 시 저장한 예상 크기를 비교하고,
        `x-amz-checksum-sha256` 또는 `x-amz-meta-sha256` 값을 예상 SHA-256과 비교한다.
        S3 ETag는 멀티파트 여부 등에 따라 파일 SHA-256이 아닐 수 있으므로 무결성 판정에 사용하지 않는다.
      security:
        - DeviceBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IotUploadCompleteRequest'
      responses:
        '200':
          description: 검증 완료 또는 기존 멱등 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '401':
          $ref: '#/components/responses/DeviceUnauthorized'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/devices/{deviceId}/access-logs:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Audit]
      operationId: listDeviceAccessLogs
      summary: 기기 접근 감사 로그
      description: 해당 기기의 활성 OWNER만 조회할 수 있다.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 감사 로그
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessLogPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/HiddenNotFound'

  /api/vaults:
    get:
      tags: [Vaults]
      operationId: listVaults
      summary: 참여 중인 추억 금고 목록
      description: |
        활성 VaultMembership이 있는 금고를 모두 반환한다. 연결된 기기가 하나도 없는
        금고도 `devices: []`로 포함되며, 앱은 이 경우에도 과거 영상을 조회한다.
      responses:
        '200':
          description: 금고 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vault'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Vaults]
      operationId: createVault
      summary: 기기 없이 추억 금고 생성
      description: 요청 계정이 새 금고의 유일한 OWNER가 된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVaultRequest'
      responses:
        '201':
          description: 생성된 금고
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vault'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/vaults/{vaultId}:
    parameters:
      - $ref: '#/components/parameters/VaultId'
    get:
      tags: [Vaults]
      operationId: getVault
      summary: 추억 금고 단건 조회
      responses:
        '200':
          description: 금고 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vault'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HiddenNotFound'

  /api/vaults/{vaultId}/invitations:
    parameters:
      - $ref: '#/components/parameters/VaultId'
    get:
      tags: [Vaults]
      operationId: listVaultInvitations
      summary: 금고의 대기 중인 초대 목록
      description: 금고 OWNER만 조회한다.
      responses:
        '200':
          description: PENDING 초대 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
    post:
      tags: [Vaults]
      operationId: createVaultInvitation
      summary: 금고에 계정 초대
      description: |
        금고 OWNER만 수행한다. 연결된 기기가 없는 금고에도 초대할 수 있다.
        초대 대상은 이미 가입한 활성 계정이어야 하며, 초대는 그 계정의 앱 내
        받은 초대함으로만 전달된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: 생성된 초대
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          description: 금고를 찾을 수 없거나 초대 대상 계정이 없음(`INVITEE_ACCOUNT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 이미 구성원(`ALREADY_VAULT_MEMBER`)이거나 대기 중인 초대가 있음(`INVITATION_PENDING`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/vaults/{vaultId}/invitations/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/VaultId'
      - $ref: '#/components/parameters/InvitationId'
    delete:
      tags: [Vaults]
      operationId: revokeVaultInvitation
      summary: 대기 중인 금고 초대 취소
      responses:
        '204':
          description: 초대 취소 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
        '409':
          description: 대기 중인 초대가 아님(`INVITATION_NOT_PENDING`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/vaults/{vaultId}/members:
    parameters:
      - $ref: '#/components/parameters/VaultId'
    get:
      tags: [Vaults]
      operationId: listVaultMembers
      summary: 금고 구성원 목록
      description: 금고의 활성 구성원이면 누구나 조회한다. OWNER가 먼저 온다.
      responses:
        '200':
          description: 활성 구성원 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HiddenNotFound'

  /api/vaults/{vaultId}/members/{membershipId}:
    parameters:
      - $ref: '#/components/parameters/VaultId'
      - $ref: '#/components/parameters/MembershipId'
    delete:
      tags: [Vaults]
      operationId: revokeVaultMember
      summary: 금고 구성원 내보내기
      description: |
        금고 OWNER만 활성 MEMBER를 내보낼 수 있다. 내보내진 구성원은 그 금고의
        과거 영상 접근 권한도 즉시 잃으며, 영상 자체는 삭제되지 않는다.
        OWNER는 이 API로 내보낼 수 없고 먼저 소유권을 양도해야 한다.
      responses:
        '204':
          description: 구성원 내보내기 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
        '409':
          description: OWNER 대상(`OWNER_CANNOT_BE_REVOKED`) 또는 활성 MEMBER 아님(`MEMBERSHIP_NOT_ACTIVE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/vaults/{vaultId}/transfer-ownership:
    parameters:
      - $ref: '#/components/parameters/VaultId'
    post:
      tags: [Vaults]
      operationId: transferVaultOwnership
      summary: 금고 소유권 이전
      description: |
        현재 OWNER가 같은 금고의 활성 MEMBER에게 소유권을 넘긴다. 한 트랜잭션에서
        기존 OWNER는 MEMBER로 강등되고 대상이 OWNER로 승격되며, 금고에 연결된 모든
        활성 기기의 호환 멤버십에도 같은 변경이 동기화된다. 기기 연결이 없어도
        수행할 수 있다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferOwnershipRequest'
      responses:
        '204':
          description: 소유권 이전 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
        '409':
          description: 이미 본인이 OWNER(`ALREADY_OWNER`) 또는 대상이 같은 금고의 활성 MEMBER가 아님(`TRANSFER_TARGET_NOT_ACTIVE_MEMBER`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/vaults/{vaultId}/subscription:
    parameters:
      - $ref: '#/components/parameters/VaultId'
    get:
      tags: [Vaults]
      operationId: getVaultSubscription
      summary: 금고 구독 상태 조회
      description: 구독은 금고에 귀속되므로 연결된 기기가 없어도 조회할 수 있다.
      responses:
        '200':
          description: 구독 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
    put:
      tags: [Vaults]
      operationId: activateVaultSubscription
      summary: 금고 구독 시작
      description: |
        금고의 활성 OWNER만 수행한다. 기기 기준 API와 같은 금고 행을 갱신하며
        금고 영상의 보관 만료를 프리미엄 보관 기간으로 연장한다.
      responses:
        '200':
          description: 구독 활성화
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
    delete:
      tags: [Vaults]
      operationId: cancelVaultSubscription
      summary: 금고 구독 해지
      description: 해지해도 영상을 즉시 삭제하지 않고 유예 기간을 보장한다.
      responses:
        '200':
          description: 구독 해지(유예 시작)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
        '409':
          description: 활성 구독이 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/vaults/{vaultId}/access-logs:
    parameters:
      - $ref: '#/components/parameters/VaultId'
    get:
      tags: [Vaults]
      operationId: listVaultAccessLogs
      summary: 금고 접근 감사 로그
      description: |
        금고의 활성 OWNER만 조회할 수 있다. V30 이전에 기록되어 vaultId가 비어 있는
        행은 그 금고에 Binding된 적이 있는 기기의 deviceId로도 함께 조회한다.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 감사 로그
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessLogPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/HiddenNotFound'

  /api/videos/{videoId}/edits:
    post:
      tags: [Videos]
      operationId: createEditUpload
      summary: 편집 완성본 업로드 예약
      description: |
        원본 영상에 접근할 수 있는 구성원이 편집 완성본 자리를 만들고 서명된
        업로드 URL을 받는다. 완성본은 원본과 같은 `videos` 테이블의
        `EDIT_OUTPUT` 행이므로 금고·기기·보관 기준을 원본에서 물려받는다.

        업로드는 앱이 아니라 OS 백그라운드 작업이 수행한다 — 세션이 없어
        헤더를 붙일 수 없으므로 서명에는 `Content-Type`만 들어간다. 완료
        통보(API-26 같은 /complete)가 없고, 서버가 객체 도착을 훑어 READY로
        승격한다.
      parameters:
        - in: path
          name: videoId
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEditUploadRequest'
      responses:
        '201':
          description: 업로드 예약
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditUpload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/vaults/{vaultId}/edits:
    parameters:
      - $ref: '#/components/parameters/VaultId'
    get:
      tags: [Vaults]
      operationId: listVaultEdits
      summary: 금고의 편집 완성본 목록
      description: >-
        편집본을 최신순 최대 100건. 업로드가 끝난 READY뿐 아니라 올라가는 중인
        UPLOADING과 끝내 실패한 FAILED도 포함하며, 앱이 `status`로 구분해
        진행 상황을 보여 준다. 스키마는 영상 목록 항목과 같다.
      responses:
        '200':
          description: 편집 완성본 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Video'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HiddenNotFound'

  /api/videos/{videoId}/comments:
    parameters:
      - in: path
        name: videoId
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Videos]
      operationId: listVideoComments
      summary: 영상 댓글 목록
      description: 금고 구성원만 조회한다. 작성자 표시 이름은 서버가 `users`에서 조인해 준다.
      responses:
        '200':
          description: 댓글 목록(오래된 순)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VideoComment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
    post:
      tags: [Videos]
      operationId: addVideoComment
      summary: 영상 댓글 작성
      description: |
        작성자는 토큰의 사용자 UUID로 기록한다 — 앱이 보낸 표시 이름을 믿지
        않는다. 작성자를 뺀 금고 구성원에게 알림과 FCM이 나간다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: {type: string, minLength: 1, maxLength: 500}
      responses:
        '201':
          description: 작성된 댓글
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoComment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/videos/{videoId}/comments/{commentId}:
    parameters:
      - in: path
        name: videoId
        required: true
        schema: {type: string, format: uuid}
      - in: path
        name: commentId
        required: true
        schema: {type: string, format: uuid}
    patch:
      tags: [Videos]
      operationId: updateVideoComment
      summary: 영상 댓글 수정
      description: |
        쓴 사람만 고칠 수 있다. OWNER에게도 열지 않는다 — 남의 말을 고쳐 쓰는
        것과 지우는 것은 다른 일이다. 부적절한 댓글은 삭제로 처리한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: {type: string, minLength: 1, maxLength: 500}
      responses:
        '200':
          description: 수정된 댓글
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoComment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Videos]
      operationId: deleteVideoComment
      summary: 영상 댓글 삭제
      description: 쓴 사람 또는 금고 OWNER가 삭제한다.
      responses:
        '204':
          description: 삭제됨
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/HiddenNotFound'

  /api/vaults/{vaultId}/places:
    parameters:
      - $ref: '#/components/parameters/VaultId'
    get:
      tags: [Vaults]
      operationId: getVaultPlaceLayout
      summary: 금고 장소 배치와 내 기기 순서
      description: |
        `places`와 `devicePlaces`는 금고 공통이다 — 장소 이름과 기기가 어느 장소에
        있는지는 집의 사실이라 가족이 함께 본다.

        `deviceOrder`는 부른 사람의 것이다 — 기기를 어떤 순서로 볼지는 보기
        취향이라 사람마다 둔다.

        지금 어느 장소를 보고 있는지는 화면 상태라 서버에 두지 않는다.
      responses:
        '200':
          description: 배치와 순서
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceLayout'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
    put:
      tags: [Vaults]
      operationId: replaceVaultPlaceLayout
      summary: 금고 장소 배치 저장
      description: |
        장소 이름과 기기 배정을 통째로 갈아 끼운다. 금고 구성원 누구나 할 수 있다 —
        홈캠을 안방으로 옮긴 사람이 그 사실을 적을 수 있어야 하고, 잘못 적어도
        되돌리기 쉬운 데이터다.

        앱이 한 화면에서 장소 추가와 기기 이동을 함께 하므로 항목별로 나누지 않는다.
        목록에 없는 장소로 보낸 배정과 금고에 없는 기기는 조용히 버린다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlaceLayoutRequest'
      responses:
        '200':
          description: 저장된 배치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceLayout'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/vaults/{vaultId}/device-order:
    parameters:
      - $ref: '#/components/parameters/VaultId'
    put:
      tags: [Vaults]
      operationId: replaceDeviceOrder
      summary: 내 기기 순서 저장
      description: 부른 사람에게만 적용된다. 다른 구성원 화면의 순서는 그대로다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceIds]
              properties:
                deviceIds:
                  type: array
                  items: {type: string, format: uuid}
      responses:
        '200':
          description: 저장된 배치와 순서
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceLayout'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HiddenNotFound'

  /api/vaults/{vaultId}/event-stats:
    parameters:
      - $ref: '#/components/parameters/VaultId'
    get:
      tags: [Vaults]
      operationId: getVaultEventStats
      summary: 금고(가족) 단위 이벤트 통계
      description: |
        금고의 활성 구성원이 조회한다. 기기 단위 통계(API-46)와 같은 계약에
        기기별 분해(byDevice)를 더했다. 이벤트는 기기가 이 금고에 Binding돼
        있던 기간(occurred_at이 bound_at~ended_at 사이)만 집계해, 기기가 다른
        금고로 양도돼도 과거 금고의 통계가 오염되지 않는다. 기본 기간은 최근
        30일, 최대 366일이다.
      parameters:
        - name: from
          in: query
          schema: {type: string, format: date}
        - name: to
          in: query
          schema: {type: string, format: date}
        - name: timeZone
          in: query
          schema: {type: string, default: Asia/Seoul}
        - name: type
          in: query
          description: 이벤트 타입 필터(예 LAUGHTER). detectedCount·byDevice·dailyCounts를 거르고 byType은 전체 분포를 유지한다.
          schema: {type: string, pattern: '^[A-Za-z_]{1,32}$'}
      responses:
        '200':
          description: 금고 단위 집계
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultEventStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HiddenNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    UserBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Flutter 앱 사용자의 짧은 수명 JWT access token
    DeviceBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: DeviceCredential
      description: IoT 기기 전용 운영 자격 증명. 사용자 JWT와 상호 대체할 수 없다.

  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VaultId:
      name: vaultId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceIdQuery:
      name: deviceId
      in: query
      required: true
      description: 로그인 사용자의 활성 멤버십이 있는 기기 ID
      schema:
        type: string
        format: uuid
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VideoId:
      name: videoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StreamSessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TriggerTypeQuery:
      name: triggerType
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/VideoTriggerType'
    Cursor:
      name: cursor
      in: query
      required: false
      description: 서버가 반환한 불투명 키셋 커서
      schema:
        type: string
        maxLength: 500
    PageSize:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 요청의 sourceEventId와 같은 기기별 멱등 키
      schema:
        type: string
        minLength: 1
        maxLength: 100

  responses:
    BadRequest:
      description: 요청 본문 또는 파라미터 검증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 사용자 인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: AUTHENTICATION_REQUIRED
            message: 로그인이 필요합니다.
            requestId: req-01
    DeviceUnauthorized:
      description: 기기 인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: DEVICE_AUTHENTICATION_FAILED
            message: 기기 인증에 실패했습니다.
            requestId: req-01
    ForbiddenRole:
      description: 대상 기기의 활성 구성원이지만 요청 작업에 필요한 OWNER 역할이 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: OWNER_ROLE_REQUIRED
            message: 기기 소유자 권한이 필요합니다.
            requestId: req-01
    HiddenNotFound:
      description: 리소스가 없거나 현재 인증 주체가 접근할 수 없음. 두 경우를 구분하지 않는다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: RESOURCE_NOT_FOUND
            message: 리소스를 찾을 수 없습니다.
            requestId: req-01
    Conflict:
      description: 현재 상태와 요청이 충돌함
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: 요청 형식 또는 값 검증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: MVP 단일 업로드 한도 500 MiB 초과
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: VIDEO_TOO_LARGE
            message: 영상은 500 MiB 이하여야 합니다.
            requestId: req-01

  schemas:
    ErrorResponse:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
