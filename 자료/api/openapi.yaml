          type: string
          format: uuid
        name:
          type: string
        model:
          type: string
        status:
          type: string
          enum: [ONLINE, OFFLINE]
          description: Redis presence 키의 존재 여부로 결정되며 heartbeat TTL로 만료된다.
        lastSeenAt:
          type: string
          format: date-time
          nullable: true

