          type: string
          format: date
        timeZone:
          type: string
          example: Asia/Seoul
        detectedCount:
          type: integer
          format: int64
          description: 영상 생성·업로드 성공 여부와 무관한 원시 감지 횟수
        uploadedVideoCount:
          type: integer
          format: int64
