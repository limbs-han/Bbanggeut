      &lt;/div&gt;

      &lt;div class=&quot;wj-screen&quot; data-screen=&quot;stream&quot;&gt;
        &lt;div class=&quot;wj-section-head&quot;&gt;&lt;div&gt;&lt;h2&gt;실시간 보기&lt;/h2&gt;&lt;span class=&quot;text-small text-muted&quot; data-selected-device-name&gt;거실 카메라&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;viz-badge&quot; id=&quot;wj-stream-state&quot;&gt;시작 전&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;wj-video&quot; role=&quot;img&quot; aria-label=&quot;실시간 카메라 스트림&quot;&gt;&lt;i data-lucide=&quot;video&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/div&gt;
        &lt;div class=&quot;wj-player-controls&quot;&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;HLS · H.264/AAC remux&lt;/span&gt;&lt;span class=&quot;text-small text-muted&quot; id=&quot;wj-stream-meta&quot;&gt;시작 전&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;wj-split&quot;&gt;&lt;button class=&quot;btn btn-primary&quot; id=&quot;wj-stream-start&quot; type=&quot;button&quot;&gt;&lt;i data-lucide=&quot;radio&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; 라이브 시작&lt;/button&gt;&lt;button class=&quot;btn&quot; id=&quot;wj-stream-end&quot; type=&quot;button&quot; hidden&gt;&lt;i data-lucide=&quot;square&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; 라이브 종료&lt;/button&gt;&lt;/div&gt;
        &lt;div class=&quot;wj-note&quot;&gt;&lt;i data-lucide=&quot;clock&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span id=&quot;wj-stream-message&quot;&gt;시작하면 활성 기기 구성원 권한을 확인하고 단일 MQTT 명령 토픽에 START_STREAM을 보냅니다. 준비에는 보통 수초가 걸립니다.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;wj-note&quot;&gt;&lt;i data-lucide=&quot;refresh-cw&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;15초 heartbeat·45초 TTL, 마지막 활동 기준 최대 60초 STOP을 적용합니다. 시청 중 120초 hardExpiresAt을 갱신하며 장애 시 기기가 자체 종료합니다.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;wj-note&quot;&gt;&lt;i data-lucide=&quot;git-branch&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;Jetson 단일 H.264/AAC 인코더→기기 live publisher→별도 미디어 계층 순서이며, HLS는 재인코딩 없이 remux·fan-out합니다.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;wj-note&quot;&gt;&lt;i data-lucide=&quot;activity&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;상태는 PENDING·READY·CLOSED·EXPIRED·FAILED이며 CLOSED/EXPIRED는 같은 종료 화면으로 표시합니다.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;wj-note&quot;&gt;&lt;i data-lucide=&quot;shield-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;이 영상은 선택한 기기의 활성 기기 구성원만 볼 수 있습니다.&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;wj-screen&quot; data-screen=&quot;members&quot; data-membership-scope=&quot;device&quot;&gt;
        &lt;div class=&quot;wj-section-head&quot;&gt;&lt;div&gt;&lt;h2&gt;기기 구성원&lt;/h2&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;&lt;span data-selected-device-name&gt;거실 카메라&lt;/span&gt; · 공유 사용자 3명&lt;/span&gt;&lt;/div&gt;&lt;button class=&quot;btn btn-primary&quot; id=&quot;wj-device-invite-button&quot; data-owner-only type=&quot;button&quot;&gt;&lt;i data-lucide=&quot;user-plus&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; 기기 초대&lt;/button&gt;&lt;/div&gt;
        &lt;div class=&quot;wj-member&quot;&gt;&lt;span class=&quot;wj-avatar&quot;&gt;나&lt;/span&gt;&lt;span&gt;&lt;strong&gt;김제임스&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;owner@example.com&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;viz-badge&quot; id=&quot;wj-current-device-role&quot;&gt;OWNER&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;wj-member&quot;&gt;&lt;span class=&quot;wj-avatar&quot;&gt;공&lt;/span&gt;&lt;span&gt;&lt;strong id=&quot;wj-other-member-name&quot;&gt;공유 사용자 A&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;member-a@example.com&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;viz-badge&quot; id=&quot;wj-other-member-role&quot;&gt;MEMBER&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;wj-member&quot;&gt;&lt;span class=&quot;wj-avatar&quot;&gt;공&lt;/span&gt;&lt;span&gt;&lt;strong&gt;공유 사용자 B&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;member-b@example.com&lt;/span&gt;&lt;/span&gt;&lt;button class=&quot;btn btn-ghost&quot; data-owner-only type=&quot;button&quot;&gt;권한 회수&lt;/button&gt;&lt;/div&gt;
        &lt;div class=&quot;wj-note&quot;&gt;&lt;i data-lucide=&quot;info&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;제품 코드는 최초 등록에만 사용합니다. 이후 사용자는 기기 소유자의 기기 초대로 참여합니다.&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;wj-screen&quot; data-screen=&quot;settings&quot;&gt;
        &lt;div&gt;&lt;h2&gt;보관 및 보안&lt;/h2&gt;&lt;p class=&quot;text-muted&quot;&gt;&lt;span data-selected-device-name&gt;거실 카메라&lt;/span&gt;의 사생활 영상 설정입니다.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;wj-list-row&quot;&gt;&lt;span&gt;&lt;strong&gt;녹화 상태 LED&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;녹화 중 항상 표시&lt;/span&gt;&lt;/span&gt;&lt;label class=&quot;form-check form-switch&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; checked aria-label=&quot;녹화 LED 사용&quot;&gt;&lt;/label&gt;&lt;/div&gt;
        &lt;div class=&quot;wj-list-row&quot;&gt;&lt;span&gt;&lt;strong&gt;영상 자동 삭제&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;기본 보관 기간&lt;/span&gt;&lt;/span&gt;&lt;select class=&quot;form-select&quot; aria-label=&quot;영상 보관 기간&quot;&gt;&lt;option&gt;30일&lt;/option&gt;&lt;option&gt;7일&lt;/option&gt;&lt;option&gt;90일&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;
        &lt;div class=&quot;wj-list-row&quot;&gt;&lt;span&gt;&lt;strong&gt;접근 기록&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;최근 조회·다운로드 확인&lt;/span&gt;&lt;/span&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;보기&lt;/button&gt;&lt;/div&gt;
        &lt;div class=&quot;wj-list-row&quot; data-owner-only&gt;&lt;span&gt;&lt;strong&gt;기기 등록 해제&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;이 기기의 영상과 기기 구성원 권한 확인 필요&lt;/span&gt;&lt;/span&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;관리&lt;/button&gt;&lt;/div&gt;
        &lt;div class=&quot;wj-note&quot;&gt;&lt;i data-lucide=&quot;lock&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;재생·다운로드 주소는 짧은 시간만 유효하며 권한 회수 후 재발급되지 않습니다.&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;

      &lt;nav class=&quot;wj-bottom-nav&quot; aria-label=&quot;하단 탐색&quot;&gt;
        &lt;button class=&quot;btn btn-ghost&quot; type=&quot;button&quot; data-go=&quot;dashboard&quot;&gt;&lt;i data-lucide=&quot;house&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; 홈&lt;/button&gt;
        &lt;button class=&quot;btn btn-ghost&quot; type=&quot;button&quot; data-go=&quot;videos&quot;&gt;&lt;i data-lucide=&quot;film&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; 영상&lt;/button&gt;
        &lt;button class=&quot;btn btn-ghost&quot; type=&quot;button&quot; data-go=&quot;members&quot;&gt;&lt;i data-lucide=&quot;users&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; 기기 구성원&lt;/button&gt;
        &lt;button class=&quot;btn btn-ghost&quot; type=&quot;button&quot; data-go=&quot;settings&quot;&gt;&lt;i data-lucide=&quot;settings&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; 설정&lt;/button&gt;
      &lt;/nav&gt;
    &lt;/section&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;wj-wireframe&#x27;);
      const names = {
        login: &#x27;로그인&#x27;, dashboard: &#x27;홈&#x27;, register: &#x27;기기 등록&#x27;, videos: &#x27;영상 목록&#x27;,
        edit: &#x27;영상 편집&#x27;, stream: &#x27;실시간 보기&#x27;, members: &#x27;기기 구성원&#x27;, settings: &#x27;설정&#x27;
      };
      const devices = {
        living: { name: &#x27;거실 카메라&#x27;, role: &#x27;OWNER&#x27;, online: true, lastSeen: &#x27;방금 전&#x27;, otherName: &#x27;공유 사용자 A&#x27;, otherRole: &#x27;MEMBER&#x27; },
        studio: { name: &#x27;작업실 카메라&#x27;, role: &#x27;MEMBER&#x27;, online: false, lastSeen: &#x27;12분 전&#x27;, otherName: &#x27;박소유자&#x27;, otherRole: &#x27;OWNER&#x27; }
      };
      const showScreen = (name) =&gt; {
        root.querySelectorAll(&#x27;[data-screen]&#x27;).forEach((screen) =&gt; {
          screen.classList.toggle(&#x27;is-active&#x27;, screen.dataset.screen === name);
        });
        root.querySelectorAll(&#x27;[data-screen-button]&#x27;).forEach((button) =&gt; {
          const selected = button.dataset.screenButton === name;
          button.classList.toggle(&#x27;is-selected&#x27;, selected);
          button.setAttribute(&#x27;aria-pressed&#x27;, String(selected));
        });
        root.querySelectorAll(&#x27;[data-map]&#x27;).forEach((row) =&gt; {
          row.classList.toggle(&#x27;is-active&#x27;, row.dataset.map === name);
        });
        root.querySelector(&#x27;#wj-screen-name&#x27;).textContent = names[name];
      };
      root.querySelectorAll(&#x27;[data-screen-button]&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; showScreen(button.dataset.screenButton));
      });
      root.querySelectorAll(&#x27;[data-go]&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; showScreen(button.dataset.go));
      });
      const selectDevice = (deviceId) =&gt; {
        const device = devices[deviceId];
        if (!device) return;
        root.querySelectorAll(&#x27;[data-device-option]&#x27;).forEach((button) =&gt; {
          const selected = button.dataset.deviceOption === deviceId;
          button.classList.toggle(&#x27;is-selected&#x27;, selected);
          button.setAttribute(&#x27;aria-pressed&#x27;, String(selected));
        });
        root.querySelectorAll(&#x27;[data-selected-device-name]&#x27;).forEach((node) =&gt; {
          node.textContent = device.name;
        });
        root.querySelector(&#x27;#wj-selected-device-meta&#x27;).textContent = `${device.role} · 마지막 연결 ${device.lastSeen}`;
        root.querySelector(&#x27;#wj-device-status&#x27;).innerHTML = `&lt;span class=&quot;wj-status-dot&quot;&gt;&lt;/span&gt; ${device.online ? &#x27;온라인&#x27; : &#x27;오프라인&#x27;}`;
        root.querySelector(&#x27;#wj-current-device-role&#x27;).textContent = device.role;
        root.querySelector(&#x27;#wj-other-member-name&#x27;).textContent = device.otherName;
        root.querySelector(&#x27;#wj-other-member-role&#x27;).textContent = device.otherRole;
        root.querySelectorAll(&#x27;[data-owner-only]&#x27;).forEach((node) =&gt; {
          node.hidden = device.role !== &#x27;OWNER&#x27;;
        });
      };
      root.querySelectorAll(&#x27;[data-device-option]&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; selectDevice(button.dataset.deviceOption));
      });
      selectDevice(&#x27;living&#x27;);

      const streamState = root.querySelector(&#x27;#wj-stream-state&#x27;);
      const streamMeta = root.querySelector(&#x27;#wj-stream-meta&#x27;);
      const streamMessage = root.querySelector(&#x27;#wj-stream-message&#x27;);
      const streamStart = root.querySelector(&#x27;#wj-stream-start&#x27;);
      const streamEnd = root.querySelector(&#x27;#wj-stream-end&#x27;);
      let streamReadyTimer;
      const setStreamState = (state) =&gt; {
        const states = {
          PENDING: {
            badge: &#x27;시작 대기&#x27;, meta: &#x27;HLS 세그먼트 준비 중 · 보통 수초&#x27;,
            message: &#x27;활성 DeviceMembership 확인을 마쳤습니다. 첫 keyframe을 기다리는 동안에도 앱은 15초마다 heartbeat합니다.&#x27;
          },
          READY: {
            badge: &#x27;● LIVE&#x27;, meta: &#x27;시청자 2명 · 기기 송출 1개 공유&#x27;,
            message: &#x27;재생 중입니다. 앱은 15초마다 heartbeat하고 서버는 hardExpiresAt을 약 120초 뒤로 연장합니다.&#x27;
          },
          CLOSED: {
            badge: &#x27;세션 종료&#x27;, meta: &#x27;종료됨 · 다시 시작 가능&#x27;,
            message: &#x27;정상 DELETE로 종료되었습니다. 마지막 유효 활동부터 최대 60초 안에 STOP_STREAM을 보냅니다.&#x27;
          },
          EXPIRED: {
            badge: &#x27;세션 종료&#x27;, meta: &#x27;연결 만료 · 다시 시작 가능&#x27;,
            message: &#x27;heartbeat 만료로 종료되었습니다. CLOSED와 같은 종료 화면에서 새 세션을 시작할 수 있습니다.&#x27;
          },
          FAILED: {
            badge: &#x27;시작 실패&#x27;, meta: &#x27;연결 실패 · 다시 시도&#x27;,
            message: &#x27;기기 오프라인 또는 송출 준비 실패입니다. 상태를 확인한 뒤 다시 시도해 주세요.&#x27;
          }
        };
        const current = states[state];
        streamState.textContent = current.badge;
        streamMeta.textContent = current.meta;
        streamMessage.textContent = current.message;
        streamStart.hidden = state === &#x27;PENDING&#x27; || state === &#x27;READY&#x27;;
        streamEnd.hidden = state !== &#x27;READY&#x27;;
      };
      const showStreamIdle = () =&gt; {
        streamState.textContent = &#x27;시작 전&#x27;;
        streamMeta.textContent = &#x27;시작 전&#x27;;
        streamMessage.textContent = &#x27;시작하면 활성 기기 구성원 권한을 확인하고 단일 MQTT 명령 토픽에 START_STREAM을 보냅니다. 준비에는 보통 수초가 걸립니다.&#x27;;
        streamStart.hidden = false;
        streamEnd.hidden = true;
      };
      streamStart.addEventListener(&#x27;click&#x27;, () =&gt; {
        window.clearTimeout(streamReadyTimer);
        setStreamState(&#x27;PENDING&#x27;);
        streamReadyTimer = window.setTimeout(() =&gt; setStreamState(&#x27;READY&#x27;), 1500);
      });
      streamEnd.addEventListener(&#x27;click&#x27;, () =&gt; {
        window.clearTimeout(streamReadyTimer);
        setStreamState(&#x27;CLOSED&#x27;);
      });
      showStreamIdle();

      const start = root.querySelector(&#x27;#wj-edit-start&#x27;);
      const end = root.querySelector(&#x27;#wj-edit-end&#x27;);
      const format = (seconds) =&gt; `${String(Math.floor(seconds / 60)).padStart(2, &#x27;0&#x27;)}:${String(seconds % 60).padStart(2, &#x27;0&#x27;)}`;
      const updateSelection = (source) =&gt; {
        let startValue = Number(start.value);
        let endValue = Number(end.value);
        if (endValue - startValue &lt; 10) {
          if (source === start) startValue = endValue - 10;
          else endValue = startValue + 10;
          start.value = String(Math.max(0, startValue));
          end.value = String(Math.min(120, endValue));
        }
        startValue = Number(start.value);
        endValue = Number(end.value);
        root.querySelector(&#x27;#wj-start-value&#x27;).textContent = `${startValue}초`;
        root.querySelector(&#x27;#wj-end-value&#x27;).textContent = `${endValue}초`;
        root.querySelector(&#x27;#wj-edit-start-label&#x27;).textContent = format(startValue);
        root.querySelector(&#x27;#wj-edit-end-label&#x27;).textContent = format(endValue);
        root.querySelector(&#x27;#wj-edit-duration&#x27;).textContent = `${format(endValue - startValue)} 선택`;
        const selection = root.querySelector(&#x27;#wj-selection&#x27;);
        selection.style.left = `${(startValue / 120) * 100}%`;
        selection.style.width = `${((endValue - startValue) / 120) * 100}%`;
      };
      start.addEventListener(&#x27;input&#x27;, () =&gt; updateSelection(start));
      end.addEventListener(&#x27;input&#x27;, () =&gt; updateSelection(end));
      updateSelection();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
