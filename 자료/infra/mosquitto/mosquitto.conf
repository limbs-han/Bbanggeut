persistence true
persistence_location /mosquitto/data/
log_dest stdout

listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/data/password_file

# Production must expose MQTT through TLS (8883) or a TLS-terminating gateway.
# The plaintext listener is intended only for an isolated development network.
# This development config uses one shared account and has no per-device topic ACL.
# Never expose it to real devices or use it with production/private user data.
