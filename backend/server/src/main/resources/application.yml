spring:
  application:
    name: wj-server
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wj}
    username: ${DB_USER:wj}
    password: ${DB_PASSWORD:wj-dev-only}
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Kept short on purpose. Sign-in falls back to allowing the attempt when
      # the limiter cannot answer, so a stalled Redis must fail fast instead of
      # holding the request open.
      timeout: ${REDIS_TIMEOUT:500ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
server:
  forward-headers-strategy: native

mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
    # The application keeps serving sign-in without Redis, so its absence is a
    # degraded limiter rather than an unhealthy instance. Watch the limiter
    # warning logs instead of failing the health probe.
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  demo:
    enabled: ${DEMO_MODE_ENABLED:false}
    live-whep-url: ${DEMO_LIVE_WHEP_URL:}
  auth:
    access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:14d}
    jwt-secret: ${JWT_SIGNING_KEY:local-development-signing-key-change-me-2026}
    login-max-failures: ${LOGIN_MAX_FAILURES:5}
    login-failure-window: ${LOGIN_FAILURE_WINDOW:10m}
    password-reset-url: ${PASSWORD_RESET_URL:bbanggeut://password-reset?token=}
    password-reset-from: ${PASSWORD_RESET_FROM:no-reply@bbanggeut.local}
  provisioning:
    enabled: ${DEVICE_PROVISIONING_ENABLED:false}
    admin-key: ${DEVICE_PROVISIONING_ADMIN_KEY:}
  device-credential:
    bootstrap-ttl: ${DEVICE_BOOTSTRAP_TTL:15m}
    operating-ttl: ${DEVICE_CREDENTIAL_TTL:30d}
  device-claim:
    max-failures: ${DEVICE_CLAIM_MAX_FAILURES:5}
    failure-window: ${DEVICE_CLAIM_FAILURE_WINDOW:10m}
  device-presence:
    # Heartbeats arrive much more often than this. Missing the TTL means the
    # device is offline without a database sweep or stale-row update.
    ttl: ${DEVICE_PRESENCE_TTL:90s}
  invitation:
    ttl: ${INVITATION_TTL:7d}
  push:
    enabled: ${FCM_ENABLED:false}
    project-id: ${FIREBASE_PROJECT_ID:}
  subscription:
    premium-retention-days: ${SUBSCRIPTION_PREMIUM_RETENTION_DAYS:365}
    grace: ${SUBSCRIPTION_GRACE:30d}
  retention:
    sweep-delay: ${RETENTION_SWEEP_DELAY:60000}
  upload:
    stale-after: ${UPLOAD_STALE_AFTER:30m}
    sweep-delay-ms: ${UPLOAD_SWEEP_DELAY_MS:60000}
  mqtt:
    broker-url: ${MQTT_BROKER_URL:ssl://localhost:8883}
    client-id: ${MQTT_CLIENT_ID:wj-backend-local}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
    environment: ${MQTT_ENV:local}
    tls-ca-path: ${MQTT_TLS_CA_PATH:}
  stream:
    viewer-ttl: ${STREAM_VIEWER_TTL:45s}
    idle-timeout: ${STREAM_IDLE_TIMEOUT:60s}
    edge-lease: ${STREAM_EDGE_LEASE:120s}
    heartbeat-interval: ${STREAM_HEARTBEAT_INTERVAL:15s}
    webrtc-base-url: ${WEBRTC_BASE_URL:http://localhost:8889/live}
    live-token-ttl: ${LIVE_TOKEN_TTL:30s}
    talkback-whip-base-url: ${TALKBACK_WHIP_BASE_URL:http://localhost:8889/talkback}
    # heartbeat-interval(15s)보다 길어야 말하는 도중 권한이 끊기지 않는다.
    talkback-ttl: ${TALKBACK_TTL:30s}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:${S3_ENDPOINT:http://localhost:9000}}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:wj-videos}
    # 편집 서버(editor-api)의 부산물 버킷. 비워 두면 영상 삭제 시 편집
    # 데이터 청소를 건너뛴다(편집 기능을 안 쓰는 환경).
    edit-bucket: ${S3_EDIT_BUCKET:}
    upload-url-ttl: ${S3_UPLOAD_URL_TTL:15m}
    read-url-ttl: ${S3_READ_URL_TTL:5m}
  comic:
    # 파이썬 만화 워커. 외부에 열지 않고 서버 네트워크 안에서만 부른다.
    # 워커는 app.storage.public-endpoint로 서명된 원본 URL을 ffmpeg로 읽는다.
    # 그러므로 그 주소가 워커에서도 닿아야 한다 — 로컬에서 워커만 컨테이너로
    # 띄웠다면 S3_PUBLIC_ENDPOINT를 http://host.docker.internal:9000으로 준다.
    worker-base-url: ${COMIC_WORKER_BASE_URL:http://127.0.0.1:18080}
    # 워커가 150초에 스스로 끊고 앱은 180초까지 기다린다. 그 사이에 둔다.
    worker-timeout: ${COMIC_WORKER_TIMEOUT:160s}
    # 그림 한 장이 실제 크레딧을 쓴다. 사용자별 예산을 두지 않으면 요금 구멍이 된다.
    rate-window: ${COMIC_RATE_WINDOW:1h}
    rate-limit: ${COMIC_RATE_LIMIT:20}
