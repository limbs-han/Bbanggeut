spring:
  application:
    name: wj-server
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wj}
    username: ${DB_USER:wj}
    password: ${DB_PASSWORD:wj-dev-only}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  auth:
    access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:14d}
    jwt-secret: ${JWT_SIGNING_KEY:local-development-signing-key-change-me-2026}
  device-claim:
    max-failures: ${DEVICE_CLAIM_MAX_FAILURES:5}
    failure-window: ${DEVICE_CLAIM_FAILURE_WINDOW:10m}
  invitation:
    ttl: ${INVITATION_TTL:7d}
  video-edit:
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    process-timeout: ${FFMPEG_PROCESS_TIMEOUT:10m}
    worker-delay: ${VIDEO_EDIT_WORKER_DELAY:5s}
  mqtt:
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    client-id: ${MQTT_CLIENT_ID:wj-backend-local}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
    environment: ${MQTT_ENV:local}
  stream:
    viewer-ttl: ${STREAM_VIEWER_TTL:45s}
    idle-timeout: ${STREAM_IDLE_TIMEOUT:60s}
    edge-lease: ${STREAM_EDGE_LEASE:120s}
    heartbeat-interval: ${STREAM_HEARTBEAT_INTERVAL:15s}
    media-base-url: ${MEDIA_BASE_URL:http://localhost:8888/live}
    live-token-ttl: ${LIVE_TOKEN_TTL:30s}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:wj-videos}
    upload-url-ttl: ${S3_UPLOAD_URL_TTL:15m}
    read-url-ttl: ${S3_READ_URL_TTL:5m}
