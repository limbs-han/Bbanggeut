map $arg_token $wj_live_token {
    default $arg_token;
    ""      $cookie_wj_live_token;
}

map $arg_token $wj_live_cookie {
    default "wj_live_token=$arg_token; Path=/live/; Max-Age=30; HttpOnly; Secure; SameSite=Lax";
    ""      "";
}

server {
    listen 80;
    listen [::]:80;
    server_name i15e201.p.ssafy.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name i15e201.p.ssafy.io;

    ssl_certificate /etc/letsencrypt/live/i15e201.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/i15e201.p.ssafy.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;

    location = /health {
        proxy_pass http://127.0.0.1:8081/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location ~ "^/live/(?<wj_stream_id>[0-9a-fA-F-]{36})/" {
        auth_request /_live_auth;
        add_header Set-Cookie $wj_live_cookie always;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location = /_live_auth {
        internal;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_pass http://127.0.0.1:8081/api/live/introspect?streamId=$wj_stream_id&token=$wj_live_token;
    }

    location / {
        return 404;
    }
}
