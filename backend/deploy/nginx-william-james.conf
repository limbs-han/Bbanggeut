map $arg_token $wj_live_token {
    default $arg_token;
    ""      $cookie_wj_live_token;
}

map $arg_token $wj_live_cookie {
    default "wj_live_token=$arg_token; Path=/live/; Max-Age=30; HttpOnly; Secure; SameSite=Lax";
    ""      "";
}

server {
    listen 80;
    listen [::]:80;
    server_name i15e201.p.ssafy.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name i15e201.p.ssafy.io;

    ssl_certificate /etc/letsencrypt/live/i15e201.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/i15e201.p.ssafy.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;

    location = /health {
        proxy_pass http://127.0.0.1:8081/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # MinIO validates every presigned request. Keeping the bucket name in the
    # public path lets mobile clients use HTTPS URLs without exposing port 9000.
    location ^~ /william-james-videos {
        client_max_body_size 2g;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        add_header Cache-Control "private, no-store" always;
    }

    # Fixed demo publisher with the same token-to-stream binding as real paths.
    # Keeping the public and upstream path identical preserves MediaMTX HLS cookies.
    location ^~ /demo-live/ {
        set $wj_auth_stream_id $arg_streamId;
        set $wj_auth_token $wj_live_token;
        auth_request /_live_auth;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        # cookieCheck=1 is carried through every HLS URI, so native players do
        # not need to understand MediaMTX's duplicate Partitioned cookie headers.
        proxy_hide_header Set-Cookie;
    }

    location ~ "^/live/(?<wj_stream_id>[0-9a-fA-F-]{36})/" {
        # Preserve main-request captures and query args for the auth subrequest.
        # $arg_token and regex captures are otherwise recomputed for /_live_auth.
        set $wj_auth_stream_id $wj_stream_id;
        set $wj_auth_token $wj_live_token;
        auth_request /_live_auth;
        add_header Set-Cookie $wj_live_cookie always;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # WHEP signaling stays on HTTPS while WebRTC media uses the dedicated
    # MediaMTX ICE listener on UDP 8189. Every WHEP request is bound to the
    # same short-lived live token as HLS.
    location ~ "^/webrtc/live/(?<wj_stream_id>[0-9a-fA-F-]{36})/whep" {
        set $wj_auth_stream_id $wj_stream_id;
        set $wj_auth_token $arg_token;
        auth_request /_live_auth;
        rewrite ^/webrtc/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8889;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_redirect ~^http://127\.0\.0\.1:8889/(.*)$ https://$host/webrtc/$1;
        proxy_redirect ~^/(.*)$ /webrtc/$1;
        add_header Cache-Control "no-store" always;
    }

    location ~ "^/webrtc/demo-live/whep" {
        set $wj_auth_stream_id $arg_streamId;
        set $wj_auth_token $arg_token;
        auth_request /_live_auth;
        rewrite ^/webrtc/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8889;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_redirect ~^http://127\.0\.0\.1:8889/(.*)$ https://$host/webrtc/$1;
        proxy_redirect ~^/(.*)$ /webrtc/$1;
        add_header Cache-Control "no-store" always;
    }

    location = /_live_auth {
        internal;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_pass http://127.0.0.1:8081/api/live/introspect?streamId=$wj_auth_stream_id&token=$wj_auth_token;
    }

    location / {
        return 404;
    }
}
