# Volumetric limiting for credential endpoints. An empty key disables the limit
# for that request, so /api/ keeps a single location block and inherits its
# proxy headers unchanged. The application still enforces the precise per
# account window; these zones only stop floods before they reach the JVM.
map $uri $wj_auth_key {
    default                      "";
    ~^/api/auth/login$           $binary_remote_addr;
    ~^/api/auth/signup$          $binary_remote_addr;
    ~^/api/auth/refresh$         $binary_remote_addr;
    ~^/api/auth/password/reset$  $binary_remote_addr;
}

# Endpoints that send mail or guess a registration code. Mobile carriers put
# many users behind one NAT address, so the general zone stays generous while
# only these two get a tight budget.
map $uri $wj_auth_strict_key {
    default                      "";
    ~^/api/auth/password/forgot$ $binary_remote_addr;
    ~^/api/devices/claim$        $binary_remote_addr;
}

limit_req_zone $wj_auth_key        zone=wj_auth:10m        rate=60r/m;
limit_req_zone $wj_auth_strict_key zone=wj_auth_strict:10m rate=10r/m;

# Match the application's own throttling response instead of the 503 default.
limit_req_status 429;
limit_req_log_level warn;

server {
    listen 80;
    listen [::]:80;
    server_name i15e201.p.ssafy.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name i15e201.p.ssafy.io;

    ssl_certificate /etc/letsencrypt/live/i15e201.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/i15e201.p.ssafy.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;

    location = /health {
        proxy_pass http://127.0.0.1:8081/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=wj_auth        burst=20 nodelay;
        limit_req zone=wj_auth_strict burst=3  nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # MinIO validates every presigned request. Keeping the bucket name in the
    # public path lets mobile clients use HTTPS URLs without exposing port 9000.
    location ^~ /william-james-videos {
        client_max_body_size 2g;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        add_header Cache-Control "private, no-store" always;
    }

    # 편집본 재생 presigned URL 경로. 원본 버킷과 같은 방식으로 MinIO가
    # 서명을 검증한다 — editor-api가 재생 스트리밍을 물고 있지 않게 한다.
    location ^~ /william-james-edit {
        client_max_body_size 2g;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        add_header Cache-Control "private, no-store" always;
    }

    # 앱 편집 서버(editor-api). 원본 분석 업로드와 편집본 업로드가 커서 본문
    # 제한을 올리고 요청 버퍼링을 끈다. 인증은 editor-api가 백엔드와 같은
    # HS256 시크릿으로 Bearer 액세스 토큰을 직접 검증한다.
    location ^~ /editor/ {
        client_max_body_size 2g;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:18080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        add_header Cache-Control "private, no-store" always;
    }

    # WHEP signaling stays on HTTPS while WebRTC media uses the dedicated
    # MediaMTX ICE listener on UDP 8189. Every WHEP request is bound to a
    # short-lived live token.
    location ~ "^/webrtc/live/(?<wj_stream_id>[0-9a-fA-F-]{36})/whep" {
        set $wj_auth_stream_id $wj_stream_id;
        set $wj_auth_token $arg_token;
        set $wj_auth_scope PLAY;
        auth_request /_live_auth;
        rewrite ^/webrtc/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8889;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_redirect ~^http://127\.0\.0\.1:8889/(.*)$ https://$host/webrtc/$1;
        proxy_redirect ~^/(.*)$ /webrtc/$1;
        add_header Cache-Control "no-store" always;
    }

    location ~ "^/webrtc/demo-live/whep" {
        set $wj_auth_stream_id $arg_streamId;
        set $wj_auth_token $arg_token;
        set $wj_auth_scope PLAY;
        auth_request /_live_auth;
        rewrite ^/webrtc/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8889;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_redirect ~^http://127\.0\.0\.1:8889/(.*)$ https://$host/webrtc/$1;
        proxy_redirect ~^/(.*)$ /webrtc/$1;
        add_header Cache-Control "no-store" always;
    }

    # 양방향 오디오는 앱이 기기 스피커로 올려보내는 WHIP 송출이다. 재생과 같은
    # 8889/8189 경로를 쓰지만 scope=TALK으로 발화 권한을 따로 검사한다: 재생
    # 토큰으로는 이 경로를 통과할 수 없다.
    location ~ "^/webrtc/talkback/(?<wj_talk_stream_id>[0-9a-fA-F-]{36})/whip" {
        set $wj_auth_stream_id $wj_talk_stream_id;
        set $wj_auth_token $arg_token;
        set $wj_auth_scope TALK;
        auth_request /_live_auth;
        rewrite ^/webrtc/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8889;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_redirect ~^http://127\.0\.0\.1:8889/(.*)$ https://$host/webrtc/$1;
        proxy_redirect ~^/(.*)$ /webrtc/$1;
        add_header Cache-Control "no-store" always;
    }

    location = /_live_auth {
        internal;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_pass http://127.0.0.1:8081/api/live/introspect?streamId=$wj_auth_stream_id&token=$wj_auth_token&scope=$wj_auth_scope;
    }

    location / {
        return 404;
    }
}
