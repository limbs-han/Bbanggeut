logLevel: info

authMethod: internal
# Users are injected by Docker Compose from the root-only infra/.env file.
authInternalUsers: []

rtsp: true
rtspTransports: [tcp]
# Keep optional while the loopback SSH-tunnel rollback is available. Set
# MEDIAMTX_RTSP_ENCRYPTION=strict after direct RTSPS and app playback pass.
rtspEncryption: optional
rtspAddress: :8554
rtspsAddress: :8322
rtspAuthMethods: [basic]
rtspServerCert: /certs/server.crt
rtspServerKey: /certs/server.key
rtmp: false
hls: false
webrtc: true
webrtcAddress: :8889
webrtcAllowOrigins: ["https://i15e201.p.ssafy.io"]
webrtcLocalUDPAddress: :8189
srt: false
moq: false
playback: false
# 관리 API는 백엔드의 유령 세션 대사(StreamMediaReconcileWorker) 전용이다.
# 컨테이너 안에서만 열고 compose가 호스트 loopback으로만 매핑한다 —
# 외부에 공개되지 않는다.
api: true
apiAddress: :9997
metrics: false
pprof: false

# Publishing is authorized by device-specific Compose users. WHEP signaling
# stays on loopback and is exposed only through the authenticated Nginx route.
paths:
  all_others:
