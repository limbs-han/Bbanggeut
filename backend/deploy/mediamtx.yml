logLevel: info

rtsp: true
rtspAddress: :8554
rtmp: false
hls: true
hlsAddress: :8888
hlsAllowOrigins: ["https://i15e201.p.ssafy.io"]
# Build HLS as soon as the Jetson starts publishing. Native players treat the
# first on-demand muxer 404 as a fatal source error instead of retrying it.
hlsAlwaysRemux: true
hlsVariant: fmp4
hlsSegmentDuration: 2s
webrtc: false
srt: false
playback: false
api: false
metrics: false
pprof: false

# Both ports are bound to loopback by Docker Compose. External publish/read
# remains disabled until device-specific TLS credentials and edge auth are wired.
paths:
  all_others:
