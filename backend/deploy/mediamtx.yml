logLevel: info

authMethod: internal
# Users are injected by Docker Compose from the root-only infra/.env file.
authInternalUsers: []

rtsp: true
rtspTransports: [tcp]
# Keep optional while the loopback SSH-tunnel rollback is available. Set
# MEDIAMTX_RTSP_ENCRYPTION=strict after direct RTSPS and app playback pass.
rtspEncryption: optional
rtspAddress: :8554
rtspsAddress: :8322
rtspAuthMethods: [basic]
rtspServerCert: /certs/server.crt
rtspServerKey: /certs/server.key
rtmp: false
hls: true
hlsAddress: :8888
hlsAllowOrigins: ["https://i15e201.p.ssafy.io"]
# Build HLS as soon as the Jetson starts publishing. Native players treat the
# first on-demand muxer 404 as a fatal source error instead of retrying it.
hlsAlwaysRemux: true
hlsVariant: fmp4
hlsSegmentDuration: 2s
webrtc: false
srt: false
moq: false
playback: false
api: false
metrics: false
pprof: false

# Publishing is authorized by the device-specific Compose user. HLS stays on
# loopback and is exposed only through the authenticated Nginx route.
paths:
  all_others:
