name: william-james

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_KMS_KES_ENDPOINT: ${MINIO_KMS_KES_ENDPOINT:?Set MINIO_KMS_KES_ENDPOINT}
      MINIO_KMS_KES_API_KEY: ${MINIO_KMS_KES_API_KEY:?Set MINIO_KMS_KES_API_KEY}
      MINIO_KMS_KES_CAPATH: /opt/kes/certs
      MINIO_KMS_KES_KEY_NAME: ${MINIO_KMS_KES_KEY_NAME:?Set MINIO_KMS_KES_KEY_NAME}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
      - ${MINIO_KES_CA_DIR:?Set MINIO_KES_CA_DIR}:/opt/kes/certs:ro
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_VIDEO_BUCKET: ${MINIO_VIDEO_BUCKET}
      MINIO_KMS_KES_KEY_NAME: ${MINIO_KMS_KES_KEY_NAME}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_VIDEO_BUCKET}"
        mc anonymous set none "local/$${MINIO_VIDEO_BUCKET}"
        mc encrypt set sse-kms "$${MINIO_KMS_KES_KEY_NAME}" "local/$${MINIO_VIDEO_BUCKET}"

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    command:
      - /bin/sh
      - -ec
      - |
        mqtt_tls_host="$${MQTT_TLS_HOST:-i15e201.p.ssafy.io}"
        if [ ! -s /mosquitto/data/dynamic-security.json ]; then
          mosquitto_ctrl dynsec init /mosquitto/data/dynamic-security.json "$${MQTT_USERNAME}" "$${MQTT_PASSWORD}"
        fi
        chown mosquitto:mosquitto /mosquitto/data/dynamic-security.json
        chmod 600 /mosquitto/data/dynamic-security.json
        mosquitto -c /mosquitto/config/mosquitto.conf & broker_pid=$$!
        until mosquitto_ctrl --cafile /mosquitto/certs/ca.crt -h "$${mqtt_tls_host}" -p 8883 -u "$${MQTT_USERNAME}" -P "$${MQTT_PASSWORD}" dynsec listClients >/dev/null 2>&1; do sleep 1; done
        if ! mosquitto_ctrl --cafile /mosquitto/certs/ca.crt -h "$${mqtt_tls_host}" -p 8883 -u "$${MQTT_USERNAME}" -P "$${MQTT_PASSWORD}" dynsec listRoles 2>/dev/null | grep -Fxq wj-backend; then
          mosquitto_ctrl --cafile /mosquitto/certs/ca.crt -h "$${mqtt_tls_host}" -p 8883 -u "$${MQTT_USERNAME}" -P "$${MQTT_PASSWORD}" dynsec createRole wj-backend
        fi
        # Replace the persisted command ACL so an existing Dynamic Security
        # volume cannot keep the retired v1 namespace active.
        mosquitto_ctrl --cafile /mosquitto/certs/ca.crt -h "$${mqtt_tls_host}" -p 8883 -u "$${MQTT_USERNAME}" -P "$${MQTT_PASSWORD}" dynsec removeRoleACL wj-backend publishClientSend '+/wj/v1/devices/+/commands' || true
        mosquitto_ctrl --cafile /mosquitto/certs/ca.crt -h "$${mqtt_tls_host}" -p 8883 -u "$${MQTT_USERNAME}" -P "$${MQTT_PASSWORD}" dynsec removeRoleACL wj-backend publishClientSend '+/wj/v2/devices/+/commands' || true
        mosquitto_ctrl --cafile /mosquitto/certs/ca.crt -h "$${mqtt_tls_host}" -p 8883 -u "$${MQTT_USERNAME}" -P "$${MQTT_PASSWORD}" dynsec addRoleACL wj-backend publishClientSend '+/wj/v2/devices/+/commands' allow 100
        # The role can persist while its client assignment is missing (for
        # example after an older partial bootstrap). Always repair it. The
        # command returns an error when the assignment already exists.
        mosquitto_ctrl --cafile /mosquitto/certs/ca.crt -h "$${mqtt_tls_host}" -p 8883 -u "$${MQTT_USERNAME}" -P "$${MQTT_PASSWORD}" dynsec addClientRole "$${MQTT_USERNAME}" wj-backend 100 || true
        kill "$$broker_pid"
        wait "$$broker_pid" || true
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ${MQTT_TLS_CERT_DIR:?Set MQTT_TLS_CERT_DIR}:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data

  mediamtx:
    image: bluenviron/mediamtx:1
    restart: unless-stopped
    environment:
      # Keep the existing Pi account unchanged while assigning Jetson a
      # different credential. Both device accounts are publish-only.
      MTX_AUTHMETHOD: internal
      MTX_AUTHINTERNALUSERS_0_USER: ${MEDIAMTX_PUBLISH_USER:?Set existing Pi MEDIAMTX_PUBLISH_USER}
      MTX_AUTHINTERNALUSERS_0_PASS: ${MEDIAMTX_PUBLISH_PASSWORD:?Set existing Pi MEDIAMTX_PUBLISH_PASSWORD}
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_0_ACTION: publish
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_0_PATH: "~^live/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"

      MTX_AUTHINTERNALUSERS_1_USER: ${MEDIAMTX_JETSON_PUBLISH_USER:?Set MEDIAMTX_JETSON_PUBLISH_USER}
      MTX_AUTHINTERNALUSERS_1_PASS: ${MEDIAMTX_JETSON_PUBLISH_PASSWORD:?Set MEDIAMTX_JETSON_PUBLISH_PASSWORD}
      MTX_AUTHINTERNALUSERS_1_PERMISSIONS_0_ACTION: publish
      MTX_AUTHINTERNALUSERS_1_PERMISSIONS_0_PATH: "~^live/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"

      # HLS is reachable only from host-loopback Nginx, which authenticates app
      # viewers before proxying requests to MediaMTX.
      MTX_AUTHINTERNALUSERS_2_USER: any
      # HLS reaches the container through the host-side loopback mapping and
      # Docker bridge. Public RTSPS clients must not inherit this read identity.
      MTX_AUTHINTERNALUSERS_2_IPS: "127.0.0.1/32,::1/128,172.16.0.0/12"
      MTX_AUTHINTERNALUSERS_2_PERMISSIONS_0_ACTION: read
      MTX_AUTHINTERNALUSERS_2_PERMISSIONS_0_PATH: "~^live/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"

      # optional preserves the existing plaintext loopback tunnel as rollback.
      # Change only this secret-file value to strict after migration validation.
      MTX_RTSPENCRYPTION: ${MEDIAMTX_RTSP_ENCRYPTION:-optional}
    ports:
      - "127.0.0.1:8554:8554"
      - "8322:8322"
      - "127.0.0.1:8888:8888"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - ${MEDIAMTX_TLS_CERT_DIR:?Set MEDIAMTX_TLS_CERT_DIR}:/certs:ro

volumes:
  postgres-data:
  minio-data:
  mosquitto-data:
