name: william-james

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction is deliberate. Under an "allkeys" policy Redis would be free to
    # discard rate limit counters when memory tightens, which hands an attacker
    # a way to clear their own record by inflating memory pressure.
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_VIDEO_BUCKET: ${MINIO_VIDEO_BUCKET}
      MINIO_EDIT_BUCKET: ${MINIO_EDIT_BUCKET:-william-james-edit}
      # 최소 권한 서비스 계정. 값이 비면 계정 생성을 건너뛰고 버킷만 만든다
      # — 옛 .env로도 기동은 되게 두되, 운영은 provision-secrets.sh가 채운다.
      WJ_BACKEND_ACCESS_KEY: ${WJ_BACKEND_ACCESS_KEY:-}
      WJ_BACKEND_SECRET_KEY: ${WJ_BACKEND_SECRET_KEY:-}
      WJ_EDITOR_ACCESS_KEY: ${WJ_EDITOR_ACCESS_KEY:-}
      WJ_EDITOR_SECRET_KEY: ${WJ_EDITOR_SECRET_KEY:-}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_VIDEO_BUCKET}"
        mc anonymous set none "local/$${MINIO_VIDEO_BUCKET}"
        mc mb --ignore-existing "local/$${MINIO_EDIT_BUCKET}"
        mc anonymous set none "local/$${MINIO_EDIT_BUCKET}"

        # 백엔드·편집 서버가 root 자격증명을 쓰면 유출 시 버킷·정책·계정
        # 관리까지 넘어간다. 각자 자기 버킷만 만지는 계정으로 분리한다.
        # mc admin user add/policy attach는 멱등이 아니라 재실행 시 이미
        # 있다는 오류를 내므로 실패를 무시한다(설정 자체는 매번 덮어쓴다).
        make_scoped_user() {
          user="$$1"; secret="$$2"; bucket="$$3"; policy="$$4"
          [ -n "$$user" ] && [ -n "$$secret" ] || return 0
          mc admin user add local "$$user" "$$secret" || true
          cat >/tmp/$$policy.json <<POLICY
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"],
              "Resource": ["arn:aws:s3:::$$bucket/*"]
            },
            {
              "Effect": "Allow",
              "Action": ["s3:ListBucket", "s3:GetBucketLocation"],
              "Resource": ["arn:aws:s3:::$$bucket"]
            }
          ]
        }
        POLICY
          mc admin policy create local "$$policy" /tmp/$$policy.json || true
          mc admin policy attach local "$$policy" --user "$$user" || true
        }
        make_scoped_user "$${WJ_BACKEND_ACCESS_KEY}" "$${WJ_BACKEND_SECRET_KEY}" \
          "$${MINIO_VIDEO_BUCKET}" wj-backend-videos
        make_scoped_user "$${WJ_EDITOR_ACCESS_KEY}" "$${WJ_EDITOR_SECRET_KEY}" \
          "$${MINIO_EDIT_BUCKET}" wj-editor-edit

  # 앱 편집 서버(video_editor). 자동 편집 추천·초안·편집본·댓글을 담당한다.
  # 배포 wrapper(wj-deploy-backend)가 릴리스에 담긴 editor-api/ 소스로 서버에서
  # 이미지를 빌드해 올린다 — video_editor/DEPLOY.md 참고. 모델은 Git 미추적이라
  # 서버의 editor-models 디렉터리(아래 volume)를 계속 쓴다.
  editor-api:
    image: wj-editor-api:latest
    restart: unless-stopped
    environment:
      MINIO_ENDPOINT: http://minio:9000
      # 편집 버킷만 접근하는 서비스 계정. 값이 없으면(옛 .env) root로
      # 폴백해 기동은 되지만, 운영은 provision-secrets.sh가 채운다.
      MINIO_ACCESS_KEY: ${WJ_EDITOR_ACCESS_KEY:-${MINIO_ROOT_USER}}
      MINIO_SECRET_KEY: ${WJ_EDITOR_SECRET_KEY:-${MINIO_ROOT_PASSWORD}}
      MINIO_BUCKET: ${MINIO_EDIT_BUCKET:-william-james-edit}
      # 백엔드 JWT_SIGNING_KEY와 같은 값. 앱 액세스 토큰을 직접 검증한다.
      EDITOR_JWT_SECRET: ${EDITOR_JWT_SECRET:-}
      # 시크릿이 비면 기동을 거부한다 — 실서버에서 인증 없는 편집 API를
      # 열어 두는 실수를 막는다.
      EDITOR_REQUIRE_AUTH: "true"
      EDITOR_MODEL_ROOT: /models
      EDITOR_SOURCE_URL_HOSTS: ${EDITOR_SOURCE_URL_HOSTS:-i15e201.p.ssafy.io}
      # 금고(가족) 범위 판정: 사용자 토큰을 이 주소의 GET /api/videos/{id}에
      # 전달해 백엔드가 구성원 여부·세션 상태를 판정한다. nginx를 한 바퀴
      # 돌지만(Spring이 loopback 전용이라) 판정 결과는 60초 캐시된다.
      EDITOR_BACKEND_URL: ${EDITOR_BACKEND_URL:-https://i15e201.p.ssafy.io}
      # 편집본 재생 presigned URL 서명 기준 호스트(백엔드 S3_PUBLIC_ENDPOINT와
      # 같은 방식). nginx의 /william-james-edit 경로가 MinIO로 프록시한다.
      EDITOR_PUBLIC_S3_ENDPOINT: ${EDITOR_PUBLIC_S3_ENDPOINT:-https://i15e201.p.ssafy.io}
      # 4컷 만화(API-71·72)가 GMS로 Gemini를 부를 때 쓴다. 값은 infra/.env에
      # 두고 여기서 읽는다 — 이 파일에 키를 적지 않는다. 비어 있어도 기동은
      # 되고 만화 요청만 502가 된다(다른 편집 기능은 이 키를 쓰지 않는다).
      GMS_KEY: ${GMS_KEY:-}
    volumes:
      - ${EDITOR_MODEL_DIR:-/home/ubuntu/william-james/editor-models}:/models:ro
    ports:
      - "127.0.0.1:18080:18080"
    depends_on:
      minio:
        condition: service_healthy

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    command:
      - /bin/sh
      - -ec
      - |
        mqtt_tls_host="$${MQTT_TLS_HOST:-i15e201.p.ssafy.io}"
        if [ ! -s /mosquitto/data/dynamic-security.json ]; then
          mosquitto_ctrl dynsec init /mosquitto/data/dynamic-security.json "$${MQTT_USERNAME}" "$${MQTT_PASSWORD}"
        fi
        chown mosquitto:mosquitto /mosquitto/data/dynamic-security.json
        chmod 600 /mosquitto/data/dynamic-security.json
        mosquitto -c /mosquitto/config/mosquitto.conf & broker_pid=$$!
        until mosquitto_ctrl --cafile /mosquitto/certs/ca.crt -h "$${mqtt_tls_host}" -p 8883 -u "$${MQTT_USERNAME}" -P "$${MQTT_PASSWORD}" dynsec listClients >/dev/null 2>&1; do sleep 1; done
        if ! mosquitto_ctrl --cafile /mosquitto/certs/ca.crt -h "$${mqtt_tls_host}" -p 8883 -u "$${MQTT_USERNAME}" -P "$${MQTT_PASSWORD}" dynsec listRoles 2>/dev/null | grep -Fxq wj-backend; then
          mosquitto_ctrl --cafile /mosquitto/certs/ca.crt -h "$${mqtt_tls_host}" -p 8883 -u "$${MQTT_USERNAME}" -P "$${MQTT_PASSWORD}" dynsec createRole wj-backend
        fi
        # Replace the persisted command ACL so an existing Dynamic Security
        # volume cannot keep the retired v1 namespace active.
        mosquitto_ctrl --cafile /mosquitto/certs/ca.crt -h "$${mqtt_tls_host}" -p 8883 -u "$${MQTT_USERNAME}" -P "$${MQTT_PASSWORD}" dynsec removeRoleACL wj-backend publishClientSend '+/wj/v1/devices/+/commands' || true
        mosquitto_ctrl --cafile /mosquitto/certs/ca.crt -h "$${mqtt_tls_host}" -p 8883 -u "$${MQTT_USERNAME}" -P "$${MQTT_PASSWORD}" dynsec removeRoleACL wj-backend publishClientSend '+/wj/v2/devices/+/commands' || true
        mosquitto_ctrl --cafile /mosquitto/certs/ca.crt -h "$${mqtt_tls_host}" -p 8883 -u "$${MQTT_USERNAME}" -P "$${MQTT_PASSWORD}" dynsec addRoleACL wj-backend publishClientSend '+/wj/v2/devices/+/commands' allow 100
        # The role can persist while its client assignment is missing (for
        # example after an older partial bootstrap). Always repair it. The
        # command returns an error when the assignment already exists.
        mosquitto_ctrl --cafile /mosquitto/certs/ca.crt -h "$${mqtt_tls_host}" -p 8883 -u "$${MQTT_USERNAME}" -P "$${MQTT_PASSWORD}" dynsec addClientRole "$${MQTT_USERNAME}" wj-backend 100 || true
        kill "$$broker_pid"
        wait "$$broker_pid" || true
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ${MQTT_TLS_CERT_DIR:?Set MQTT_TLS_CERT_DIR}:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mosquitto_ctrl --cafile /mosquitto/certs/ca.crt
          -h "$${MQTT_TLS_HOST:-i15e201.p.ssafy.io}" -p 8883
          -u "$${MQTT_USERNAME}" -P "$${MQTT_PASSWORD}"
          dynsec listClients >/dev/null
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 20s

  mediamtx:
    image: bluenviron/mediamtx:1
    restart: unless-stopped
    environment:
      # Keep the existing Pi account unchanged while assigning Jetson a
      # different credential. Both device accounts are publish-only.
      MTX_AUTHMETHOD: internal
      MTX_AUTHINTERNALUSERS_0_USER: ${MEDIAMTX_PUBLISH_USER:?Set existing Pi MEDIAMTX_PUBLISH_USER}
      MTX_AUTHINTERNALUSERS_0_PASS: ${MEDIAMTX_PUBLISH_PASSWORD:?Set existing Pi MEDIAMTX_PUBLISH_PASSWORD}
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_0_ACTION: publish
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_0_PATH: "~^live/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
      # 기기는 자기 talkback 경로를 읽어 스피커로 재생한다. 읽기만 허용하므로
      # 이 계정으로 다른 기기의 라이브를 볼 수는 없다.
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_1_ACTION: read
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_1_PATH: "~^talkback/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"

      MTX_AUTHINTERNALUSERS_1_USER: ${MEDIAMTX_JETSON_PUBLISH_USER:?Set MEDIAMTX_JETSON_PUBLISH_USER}
      MTX_AUTHINTERNALUSERS_1_PASS: ${MEDIAMTX_JETSON_PUBLISH_PASSWORD:?Set MEDIAMTX_JETSON_PUBLISH_PASSWORD}
      MTX_AUTHINTERNALUSERS_1_PERMISSIONS_0_ACTION: publish
      MTX_AUTHINTERNALUSERS_1_PERMISSIONS_0_PATH: "~^live/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
      MTX_AUTHINTERNALUSERS_1_PERMISSIONS_1_ACTION: read
      MTX_AUTHINTERNALUSERS_1_PERMISSIONS_1_PATH: "~^talkback/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"

      # WHEP read access is limited to Nginx through the host loopback mapping.
      MTX_AUTHINTERNALUSERS_2_USER: any
      # Public RTSPS clients must not inherit this read identity.
      MTX_AUTHINTERNALUSERS_2_IPS: "127.0.0.1/32,::1/128,172.16.0.0/12"
      MTX_AUTHINTERNALUSERS_2_PERMISSIONS_0_ACTION: read
      MTX_AUTHINTERNALUSERS_2_PERMISSIONS_0_PATH: "~^live/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
      # 백엔드 유령 세션 대사가 loopback에서 관리 API를 읽는다. 이 권한이
      # 없으면 API가 401을 내고 워커는 UNKNOWN(안전 모드)으로만 돈다.
      MTX_AUTHINTERNALUSERS_2_PERMISSIONS_1_ACTION: api

      # WHIP 발화 송출도 Nginx loopback으로만 들어온다. 발화 권한 검사는
      # Nginx auth_request(scope=TALK)가 이미 끝낸 뒤다.
      MTX_AUTHINTERNALUSERS_3_USER: any
      MTX_AUTHINTERNALUSERS_3_IPS: "127.0.0.1/32,::1/128,172.16.0.0/12"
      MTX_AUTHINTERNALUSERS_3_PERMISSIONS_0_ACTION: publish
      MTX_AUTHINTERNALUSERS_3_PERMISSIONS_0_PATH: "~^talkback/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"

      # optional preserves the existing plaintext loopback tunnel as rollback.
      # Change only this secret-file value to strict after migration validation.
      MTX_RTSPENCRYPTION: ${MEDIAMTX_RTSP_ENCRYPTION:-optional}
      # ICE candidates must advertise a host reachable by mobile clients.
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIAMTX_WEBRTC_ADDITIONAL_HOSTS:-i15e201.p.ssafy.io}
    ports:
      - "127.0.0.1:8554:8554"
      - "8322:8322"
      - "127.0.0.1:8889:8889"
      - "8189:8189/udp"
      # 관리 API — 백엔드 유령 세션 대사 전용, loopback만.
      - "127.0.0.1:9997:9997"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - ${MEDIAMTX_TLS_CERT_DIR:?Set MEDIAMTX_TLS_CERT_DIR}:/certs:ro

  # 관측성. 둘 다 network_mode: host + 127.0.0.1 리슨이다 — loopback 전용
  # Spring(8081)을 긁으려면 호스트 네트워크가 필요하고, 대신 리슨 주소를
  # loopback으로 고정해 외부에 열리지 않는다. 조회는 SSH 터널:
  #   ssh -L 3000:127.0.0.1:3000 ubuntu@i15e201.p.ssafy.io
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.listen-address=127.0.0.1:9090
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      # infra/.env에 GRAFANA_ADMIN_PASSWORD를 설정할 것. loopback 전용이라
      # 기본값이어도 외부 노출은 없지만, SSH 접근자 전원이 admin이 된다.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  minio-data:
  mosquitto-data:
