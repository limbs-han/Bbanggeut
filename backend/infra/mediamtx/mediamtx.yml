logLevel: info

rtsp: true
rtspAddress: :8554
rtmp: false
hls: false
webrtc: true
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcLocalUDPAddress: :8189
# USB로 연결한 실기기는 adb reverse로만 이 호스트에 닿을 수 있고 adb reverse는
# TCP만 전달한다. UDP ICE만 열어 두면 시그널링은 성공하고 미디어만 조용히
# 실패한다. 로컬 검증에서만 필요하며 운영 설정은 UDP를 그대로 쓴다.
webrtcLocalTCPAddress: :8189
srt: false
playback: false
# 데모는 DEMO_MODE_ENABLED로 돌아가 MQTT를 건너뛴다. 그래서 기기 역할을 맡은
# 노트북에 START_TALKBACK이 오지 않는다. 대신 start-talkback-speaker.ps1이 이
# API로 talkback 경로가 열리는지 감시한다. loopback에만 노출한다.
api: yes
apiAddress: 127.0.0.1:9997
metrics: false
pprof: false

paths:
  demo-live:
    source: publisher
  # 양방향 오디오는 talkback/{streamId}로 들어온다. streamId는 세션마다 달라
  # 미리 선언할 수 없다. 운영 설정도 같은 이유로 all_others를 쓴다.
  all_others:
