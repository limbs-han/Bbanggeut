# 윌리엄 제임스 백엔드 로컬 개발 환경
# 사용법: docker compose up -d  (Docker Desktop 실행 필요)
# 구성: PostgreSQL 16 + MinIO(S3 호환) + Mosquitto(MQTT)
# 주의: 모든 계정/비밀번호는 로컬 개발 전용. 배포 환경에서는 반드시 교체.

services:
  postgres:
    image: postgres:16-alpine
    container_name: wj-postgres
    environment:
      POSTGRES_DB: wj
      POSTGRES_USER: wj
      POSTGRES_PASSWORD: wj-dev-only
    ports:
      - "5432:5432"
    volumes:
      - wj-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wj -d wj"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: wj-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 웹 콘솔 http://localhost:9001
    volumes:
      - wj-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 최초 기동 시 영상 버킷 자동 생성
  minio-init:
    image: minio/mc:latest
    container_name: wj-minio-init
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/wj-videos &&
      echo 'bucket wj-videos ready'
      "

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: wj-mosquitto
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-wj-backend-local}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Set MQTT_PASSWORD in backend/.env}
    command:
      - /bin/sh
      - -ec
      - |
        if [ ! -s /mosquitto/data/dynamic-security.json ]; then
          mosquitto_ctrl dynsec init /mosquitto/data/dynamic-security.json "$${MQTT_USERNAME}" "$${MQTT_PASSWORD}"
        fi
        chown mosquitto:mosquitto /mosquitto/data/dynamic-security.json
        chmod 600 /mosquitto/data/dynamic-security.json
        mosquitto -c /mosquitto/config/mosquitto.conf & broker_pid=$$!
        until mosquitto_ctrl --cafile /mosquitto/certs/ca.crt -h localhost -p 8883 -u "$${MQTT_USERNAME}" -P "$${MQTT_PASSWORD}" dynsec listClients >/dev/null 2>&1; do sleep 1; done
        if ! mosquitto_ctrl --cafile /mosquitto/certs/ca.crt -h localhost -p 8883 -u "$${MQTT_USERNAME}" -P "$${MQTT_PASSWORD}" dynsec listRoles 2>/dev/null | grep -Fxq wj-backend; then
          mosquitto_ctrl --cafile /mosquitto/certs/ca.crt -h localhost -p 8883 -u "$${MQTT_USERNAME}" -P "$${MQTT_PASSWORD}" dynsec createRole wj-backend
        fi
        mosquitto_ctrl --cafile /mosquitto/certs/ca.crt -h localhost -p 8883 -u "$${MQTT_USERNAME}" -P "$${MQTT_PASSWORD}" dynsec removeRoleACL wj-backend publishClientSend '+/wj/v1/devices/+/commands' || true
        mosquitto_ctrl --cafile /mosquitto/certs/ca.crt -h localhost -p 8883 -u "$${MQTT_USERNAME}" -P "$${MQTT_PASSWORD}" dynsec removeRoleACL wj-backend publishClientSend '+/wj/v2/devices/+/commands' || true
        mosquitto_ctrl --cafile /mosquitto/certs/ca.crt -h localhost -p 8883 -u "$${MQTT_USERNAME}" -P "$${MQTT_PASSWORD}" dynsec addRoleACL wj-backend publishClientSend '+/wj/v2/devices/+/commands' allow 100
        mosquitto_ctrl --cafile /mosquitto/certs/ca.crt -h localhost -p 8883 -u "$${MQTT_USERNAME}" -P "$${MQTT_PASSWORD}" dynsec addClientRole "$${MQTT_USERNAME}" wj-backend 100 || true
        kill "$$broker_pid"
        wait "$$broker_pid" || true
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    ports:
      - "127.0.0.1:8883:8883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/certs:/mosquitto/certs:ro
      - wj-mosquitto:/mosquitto/data

  mediamtx:
    image: bluenviron/mediamtx:1
    container_name: wj-mediamtx
    ports:
      - "127.0.0.1:8554:8554"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8889:8889"
      - "8189:8189/udp"
    volumes:
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro

volumes:
  wj-pgdata:
  wj-minio:
  wj-mosquitto:
