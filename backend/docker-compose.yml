# 윌리엄 제임스 백엔드 로컬 개발 환경
# 사용법: docker compose up -d  (Docker Desktop 실행 필요)
# 구성: PostgreSQL 16 + MinIO(S3 호환) + Mosquitto(MQTT)
# 주의: 모든 계정/비밀번호는 로컬 개발 전용. 배포 환경에서는 반드시 교체.

services:
  postgres:
    image: postgres:16-alpine
    container_name: wj-postgres
    environment:
      POSTGRES_DB: wj
      POSTGRES_USER: wj
      POSTGRES_PASSWORD: wj-dev-only
    ports:
      - "5432:5432"
    volumes:
      - wj-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wj -d wj"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: wj-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 웹 콘솔 http://localhost:9001
    volumes:
      - wj-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 최초 기동 시 영상 버킷 자동 생성
  minio-init:
    image: minio/mc:latest
    container_name: wj-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/wj-videos &&
      echo 'bucket wj-videos ready'
      "

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: wj-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - wj-mosquitto:/mosquitto/data

volumes:
  wj-pgdata:
  wj-minio:
  wj-mosquitto:
