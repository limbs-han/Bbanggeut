    <linearGradient id="blueWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF3FA"/>
      <stop offset="1" stop-color="#C8DDEF"/>
    </linearGradient>
    <linearGradient id="warmWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAF8F4"/>
      <stop offset="1" stop-color="#EEE8DF"/>
    </linearGradient>
    <pattern id="dots" width="84" height="84" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="22" r="5" fill="#8EAFCE" opacity="0.75"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="#FBFBFA"/>
  <rect x="0" y="916" width="1920" height="164" fill="#D5E5F3"/>
  <rect x="0" y="916" width="1920" height="164" fill="url(#dots)" opacity="0.82"/>
  <rect x="0" y="854" width="84" height="226" fill="#D5E5F3"/>
  <rect x="1836" y="854" width="84" height="226" fill="#D5E5F3"/>

  <!-- House roof, matching the presentation template -->
  <path d="M78 254 L960 64 L1842 254" fill="none" stroke="#CBDEEF" stroke-width="18"/>
  <rect x="1642" y="112" width="88" height="104" fill="#CBDEEF"/>

  <!-- Header -->
  <g font-family="Pretendard, Malgun Gothic, Arial, sans-serif">
    <rect x="88" y="103" width="520" height="132" rx="18" fill="#FBFBFA" opacity="0.96"/>
    <rect x="1328" y="117" width="500" height="88" rx="18" fill="#FBFBFA" opacity="0.94"/>
    <g transform="translate(120 123)">
