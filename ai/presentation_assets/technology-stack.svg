    <path d="M109 131 V180 C109 190 133 198 163 198 C193 198 217 190 217 180 V131" fill="#D5E5F3" stroke="#6C6258" stroke-width="5"/>
    <path d="M109 155 C109 165 133 173 163 173 C193 173 217 165 217 155" fill="none" stroke="#6C6258" stroke-width="4"/>

    <text x="163" y="318" text-anchor="middle" font-size="36" font-weight="700" fill="#655847">AWS Cloud</text>
    <text x="163" y="352" text-anchor="middle" font-size="20" font-weight="500" fill="#88827C">EC2 · Docker · Nginx</text>
    <path d="M52 385 H274" stroke="#E8E4DF" stroke-width="2"/>
    <g font-size="21" font-weight="600" fill="#5F6263">
