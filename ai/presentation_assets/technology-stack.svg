    <text x="120" y="220" font-size="64" font-weight="700" fill="#655847">기술 스택</text>
    <text x="1800" y="164" text-anchor="end" font-size="25" font-weight="500" fill="#777674">사람은 순간을 살고, 기술은 기억합니다</text>
    <path d="M1440 184 H1800" stroke="#C8DDEF" stroke-width="5" stroke-linecap="round"/>
  </g>

