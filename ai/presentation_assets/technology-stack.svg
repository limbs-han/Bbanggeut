      <circle cx="68" cy="466" r="8" fill="#AFCDEA"/>
      <text x="88" y="473">MinIO 비공개 저장</text>
      <circle cx="68" cy="508" r="8" fill="#AFCDEA"/>
      <text x="88" y="515">GitLab CI/CD</text>
    </g>
