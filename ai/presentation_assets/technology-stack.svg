      <path d="M18 36 H38 M28 26 V46" stroke="#7C9FBE" stroke-width="5" stroke-linecap="round"/>
      <text x="70" y="45" font-size="25" font-weight="700" fill="#5F6263">HTTPS · JWT</text>
