    <path d="M915 36 H1010" stroke="#A8C2D9" stroke-width="5" stroke-linecap="round"/>
    <g transform="translate(1030 0)">
      <circle cx="28" cy="36" r="27" fill="#FFFFFF" opacity="0.92"/>
      <rect x="14" y="22" width="28" height="28" rx="5" fill="none" stroke="#7C9FBE" stroke-width="5"/>
      <path d="M23 19 V53 M33 19 V53" stroke="#7C9FBE" stroke-width="3"/>
      <text x="70" y="45" font-size="25" font-weight="700" fill="#5F6263">HLS</text>
    </g>
