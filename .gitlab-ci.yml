stages:
  - test
  - package
  - deploy

default:
  image: eclipse-temurin:17-jdk
  before_script:
    - cd backend/server
    - chmod +x gradlew
  cache:
    key: gradle
    paths:
      - .gradle/
      - backend/server/.gradle/

test-backend:
  stage: test
  script:
    - ./gradlew --no-daemon clean test
  artifacts:
    when: always
    reports:
      junit: backend/server/build/test-results/test/TEST-*.xml
    paths:
      - backend/server/build/reports/tests/test/
    expire_in: 7 days

package-backend:
  stage: package
  needs: [test-backend]
  script:
    - ./gradlew --no-daemon bootJar
  artifacts:
    paths:
      - backend/server/build/libs/server-*.jar
    expire_in: 7 days

deploy-production:
  stage: deploy
  image: alpine:3.22
  needs: [package-backend]
  before_script:
    - apk add --no-cache openssh-client
    - install -m 700 -d ~/.ssh
    - printf '%s' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - scp backend/server/build/libs/server-*.jar "$DEPLOY_USER@$DEPLOY_HOST:/home/ubuntu/william-james/app/server.jar.next"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" 'mv /home/ubuntu/william-james/app/server.jar.next /home/ubuntu/william-james/app/server.jar && sudo systemctl restart william-james && sudo systemctl is-active --quiet william-james'
  environment:
    name: production
    url: https://i15e201.p.ssafy.io/health
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
